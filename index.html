<!DOCTYPE html>
<!--
  CLASSIFIER NOTE:
  The opponent (O) is chosen with the Classifier combo box:
  - "Jev (TypeSafe AI)": POSTs {model, state, questions.next_move} to the
    TypeSafe endpoint with your API key (Bearer). api.typesafe.ai sends no
    CORS headers, so the browser must go through a proxy YOU control:
    either `python proxy.py` (/systemone, localhost) or your own worker.
    Never paste the key into a random public proxy.
  - "Classifier.dev": POSTs {input, labels, instructions} keyless to
    https://classifier.dev/v1/classify (CORS-open), labels = candidate
    moves, input = briefing text, returned label = O's move.
  Local tactics always write the briefing; the selected classifier chooses.
  The key lives in memory + password field only (never stored/logged).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gomoku demo — Jev / Classifier.dev</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg1: #eef2ff; --bg2: #faf5ff; --bg3: #ecfdf5;
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --card: #ffffff; --accent: #4f46e5; --accent2: #7c3aed;
    --ok: #16a34a; --bad: #dc2626; --warn: #b45309;
    --shadow: 0 12px 32px rgba(30, 27, 75, 0.12);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0; padding: 32px 20px 48px; color: var(--ink);
    background:
      radial-gradient(900px 320px at 15% -5%, #c7d2fe 0%, transparent 60%),
      radial-gradient(800px 300px at 90% 0%, #ddd6fe 0%, transparent 55%),
      linear-gradient(135deg, var(--bg1), var(--bg2) 48%, var(--bg3));
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 1120px; }
  .hero {
    background: linear-gradient(180deg, #ffffff, #f8faff);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px 16px; margin-bottom: 14px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), #06b6d4);
  }
  .brand { display: flex; gap: 14px; align-items: center; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; flex: 0 0 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.1rem;
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
  }
  h1 { margin: 0; font-size: 1.55rem; letter-spacing: -0.02em; }
  .subtitle { margin: 4px 0 10px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .badge {
    font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;
  }
  .badge.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .badge.green { background: #dcfce7; border-color: #bbf7d0; color: #166534; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 600; flex: 1 1 260px; }
  .field span.hint-inline { font-weight: 400; color: var(--muted); }
  .field input, .field select {
    padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px;
    font-size: 0.95rem; min-width: 0; width: 100%; background: #f8fafc;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18); background: #fff; }
  button {
    padding: 11px 18px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 700;
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    white-space: nowrap;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.05); }
  button:active { transform: translateY(0); }
  #status {
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--accent);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; min-height: 3.2em;
    font-size: 0.95rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    box-shadow: var(--shadow);
  }
  #status .err { color: var(--bad); font-weight: 600; }
  #status .warn { color: var(--warn); font-weight: 600; }
  .game-row { display: grid; grid-template-columns: minmax(300px, 640px) minmax(300px, 1fr); gap: 16px; align-items: start; justify-content: center; }
  @media (max-width: 980px) { .game-row { grid-template-columns: 1fr; } }
  .board-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; box-shadow: var(--shadow);
  }
  .board-card .board-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .board-card .legend-note { font-size: 0.76rem; color: var(--muted); margin: 0 0 10px; }
  .board-card .legend-note b { color: var(--ink); }
  #canvas-holder canvas { cursor: pointer; }
  #canvas-holder { display: flex; justify-content: center; }
  #inspector {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; font-size: 0.85rem; box-shadow: var(--shadow);
    position: sticky; top: 16px;
  }
  #inspector h2 { margin: 0 0 6px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15); }
  #inspector .meta { color: var(--muted); margin: 8px 0 4px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  #trafficMeta { text-transform: none; font-size: 0.85rem; color: var(--ink); font-weight: 600; }
  #inspector pre {
    background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 10px;
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-size: 0.72rem; line-height: 1.5; margin: 0; border: 1px solid #1e293b;
  }
  canvas { border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); touch-action: manipulation; }
  .hint { font-size: 0.85rem; color: var(--muted); margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true">5◦</div>
      <div>
        <h1 id="gameTitle">Gomoku demo</h1>
        <p class="subtitle" id="gameSubtitle">Human is X, opponent is O.</p>
      </div>
    </div>
    <div class="badges">
      <span class="badge">X · You</span>
      <span class="badge" id="badgeO">O · Opponent</span>
      <span class="badge green">5 in a row wins</span>
    </div>
  </header>

  <div class="controls">
    <label class="field" for="classifierSel">Classifier
      <select id="classifierSel">
        <option value="jev" selected>Jev (TypeSafe AI)</option>
        <option value="classifierdev">Classifier.dev</option>
      </select>
    </label>
    <label class="field" for="apiKey" id="apiKeyField">TypeSafe API key
      <input id="apiKey" type="password" autocomplete="off" placeholder="paste key here" />
    </label>
    <button id="newGameBtn" type="button">↺ New Game</button>
  </div>

  <div id="status" role="status" aria-live="polite">Loading…</div>
  <div class="game-row">
    <section class="board-card">
      <p class="board-title">Board</p>
      <div id="canvas-holder"></div>
    </section>
    <aside id="inspector" aria-label="Classifier API traffic">
      <h2><span class="live-dot" aria-hidden="true"></span><span id="trafficTitle">Classifier traffic</span>&nbsp;<span id="trafficNote" style="font-weight:400;color:#64748b"></span></h2>
      <div class="meta" id="trafficMeta">No requests yet.</div>
      <div class="meta">Request &rarr;</div>
      <pre id="reqPre">—</pre>
      <div class="meta">Response &larr;</div>
      <pre id="resPre">—</pre>
    </aside>
  </div>
  
</main>

<script>
(function () {
  "use strict";

  var SIZE = 15;
  var WIN = 5;
  // Opponent backends. Jev (TypeSafe) needs a key + a proxy you control
  // (api.typesafe.ai sends no CORS headers); classifier.dev is keyless
  // and CORS-open. Docs: https://classifier.dev/ Spec: https://classifier.dev/openapi.json
  var CLASSIFIERS = {
    jev: {
      name: "Jev",
      fullName: "Jev (TypeSafe AI)",
      url: "https://typesafe-cors-proxy.vita-vacek.workers.dev/",
      needsKey: true,
      note: "(key redacted)"
    },
    classifierdev: {
      name: "Classifier.dev",
      fullName: "Classifier.dev",
      url: "https://classifier.dev/v1/classify",
      needsKey: false,
      note: "(keyless · classifier.dev)"
    }
  };

  var board = [];
  var gameLive = true;
  var waiting = false;      // in-flight flag: board disabled while true
  var winner = null;        // 'X' | 'O' | 'Draw' | null
  var lastMove = null;      // {r, c, who}
  var winningLine = [];     // [{r,c}]
  var statusEl = document.getElementById("status");
  var newGameBtn = document.getElementById("newGameBtn");
  var classifierSel = document.getElementById("classifierSel");
  var apiKeyEl = document.getElementById("apiKey");
  var apiKeyField = document.getElementById("apiKeyField");
  var gameTitleEl = document.getElementById("gameTitle");
  var gameSubtitleEl = document.getElementById("gameSubtitle");
  var badgeOEl = document.getElementById("badgeO");
  var trafficTitleEl = document.getElementById("trafficTitle");
  var trafficNoteEl = document.getElementById("trafficNote");
  // ---- Classifier selection: every user-visible string derives from this ----
  function selectedClassifier() {
    var v = classifierSel && classifierSel.value;
    return Object.prototype.hasOwnProperty.call(CLASSIFIERS, v) ? v : "jev";
  }

  function classifierCfg() {
    return CLASSIFIERS[selectedClassifier()];
  }

  function classifierName() {
    return classifierCfg().name;
  }

  function classifierUrl() {
    return classifierCfg().url;
  }

  // Sync title, subtitle, badge, key field, traffic header + status with the combo.
  function refreshClassifierUI() {
    var cfg = classifierCfg();
    if (apiKeyField) apiKeyField.style.display = cfg.needsKey ? "" : "none";
    if (gameTitleEl) gameTitleEl.textContent = cfg.fullName + " Gomoku demo";
    if (gameSubtitleEl) {
      gameSubtitleEl.textContent = "Human is X, " + cfg.name + " is O. The harness briefs; " +
        cfg.name + " chooses" + (cfg.needsKey ? " — key required." : " — no key needed.");
    }
    if (badgeOEl) badgeOEl.textContent = "O · " + cfg.name;
    if (trafficTitleEl) trafficTitleEl.textContent = cfg.name + " traffic";
    if (trafficNoteEl) trafficNoteEl.textContent = cfg.note;
    try { document.title = cfg.fullName + " Gomoku demo"; } catch (e) {}
    renderStatus({});
  }

  var gameId = 0;           // bumped on New Game to ignore stale responses
  var lastJevCell = null;
  var lastJevRC = null; // {r, c} 0-based, shown as R0C0–R14C14
  var lastConfidence = null;
  var trafficMetaEl = document.getElementById("trafficMeta");
  var reqPreEl = document.getElementById("reqPre");
  var resPreEl = document.getElementById("resPre");
  var exchangeCount = 0;
  var memJev = null;   // previous Jev move, e.g. "R7C8"
  var memHuman = null; // previous human move, e.g. "R8C8"
  var memPlan = null;  // previous strategic focus string

  function pretty(obj, cap) {
    var s;
    try {
      s = JSON.stringify(obj, null, 2);
    } catch (e) {
      s = String(obj);
    }
    s = redact(s);
    cap = cap || 12000;
    if (s.length > cap) return s.slice(0, cap) + "\n…[truncated " + (s.length - cap) + " chars]";
    return s;
  }

  function renderTraffic(meta, reqText, resText) {
    if (trafficMetaEl) trafficMetaEl.textContent = meta;
    // textContent (not innerHTML) + redact() => key can never leak into the panel.
    if (reqPreEl) reqPreEl.textContent = redact(reqText);
    if (resPreEl) resPreEl.textContent = redact(resText);
  }

  function emptyBoard() {
    var b = [];
    for (var r = 0; r < SIZE; r++) {
      b.push(new Array(SIZE).fill(""));
    }
    return b;
  }
  board = emptyBoard();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  // Redact Bearer tokens before anything touches the DOM / console.
  function redact(s) {
    return String(s == null ? "" : s).replace(/Bearer\s+[A-Za-z0-9._~+\/=\-]+/gi, "Bearer [REDACTED]");
  }

  // Square id and user label: R0–R14 top→bottom, C0–C14 left→right (0-based).
  function humanCell(r, c) {
    return "R" + r + "C" + c;
  }

  function setStatus(html) {
    statusEl.innerHTML = html;
  }

  function renderStatus(opts) {
    opts = opts || {};
    var name = classifierName();
    var turn;
    if (winner === "X") turn = "Game over — X (you) win!";
    else if (winner === "O") turn = "Game over — O (" + name + ") wins.";
    else if (winner === "Draw") turn = "Game over — draw, board is full.";
    else if (waiting) turn = name + " (O) is thinking… board disabled.";
    else turn = "Your turn (X) — click an empty square.";

    var html = esc(turn);
    if (lastJevCell) {
      var hm =  humanCell(lastJevRC.r, lastJevRC.c);
      var cf = lastConfidence != null ? " (confidence " + lastConfidence + ")" : "";
      html += "<br>" + esc("Last " + name + " move: " + hm + cf);
    }
    if (opts.warn) html += '<br><span class="warn">' + esc(redact(opts.warn)) + "</span>";
    if (opts.error) html += '<br><span class="err">' + esc(redact(opts.error)) + "</span>";
    setStatus(html);
  }

  function newGame() {
    gameId++;               // invalidate any in-flight response
    board = emptyBoard();
    gameLive = true;
    waiting = false;
    winner = null;
    lastMove = null;
    winningLine = [];
    lastJevCell = null;
    lastJevRC = null;
    lastConfidence = null;
    memJev = null;
    memHuman = null;
    memPlan = null;
    // Do NOT clear the API key input (required for Jev).
    renderStatus({});
    renderTraffic("No requests yet.", "—", "—");
  }

  newGameBtn.addEventListener("click", newGame);
  if (classifierSel) classifierSel.addEventListener("change", function () {
    gameId++;               // changing classifier starts no new game, but stale
    waiting = false;        // in-flight replies belong to the old backend
    refreshClassifierUI();
  });

  function inBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function checkWin(b, r, c, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var d = 0; d < dirs.length; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var line = [{ r: r, c: c }];
      var i, nr, nc;
      for (i = 1; i < WIN; i++) {
        nr = r + dr * i; nc = c + dc * i;
        if (!inBounds(nr, nc) || b[nr][nc] !== who) break;
        line.push({ r: nr, c: nc });
      }
      for (i = 1; i < WIN; i++) {
        nr = r - dr * i; nc = c - dc * i;
        if (!inBounds(nr, nc) || b[nr][nc] !== who) break;
        line.unshift({ r: nr, c: nc });
      }
      if (line.length >= WIN) {
        // Return exactly the 5 containing the placed stone (trim longer runs).
        var idx = -1;
        for (i = 0; i < line.length; i++) {
          if (line[i].r === r && line[i].c === c) { idx = i; break; }
        }
        var start = Math.max(0, Math.min(idx - (WIN - 1), line.length - WIN));
        // Prefer a window containing idx.
        start = Math.max(0, Math.min(idx, line.length - WIN));
        if (idx - start >= WIN) start = idx - WIN + 1;
        return line.slice(start, start + WIN);
      }
    }
    return null;
  }

  function boardFull(b) {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!b[r][c]) return false;
    return true;
  }

  function boardToStrings(b) {
    var rows = [];
    for (var r = 0; r < SIZE; r++) {
      var s = "";
      for (var c = 0; c < SIZE; c++) s += b[r][c] === "" ? "." : b[r][c];
      rows.push(s);
    }
    return rows;
  }

  // Aligned 0-based labeled board for the classifier's state (matches on-screen legend).
  function boardToLabeled(b) {
    var h = "   ";
    var c, r;
    for (c = 0; c < SIZE; c++) h += ("C" + c + "   ").slice(0, 3);
    var lines = [h];
    for (r = 0; r < SIZE; r++) {
      var row = ("R" + r + "  ").slice(0, 3);
      for (c = 0; c < SIZE; c++) row += (b[r][c] || ".") + "  ";
      lines.push(row);
    }
    return lines.join("\n");
  }

  function collectLine(b, r0, c0, dr, dc) {
    var cells = [];
    var r = r0, c = c0;
    while (inBounds(r, c)) {
      cells.push({ r: r, c: c, v: b[r][c] || "." });
      r += dr;
      c += dc;
    }
    return cells;
  }

  function allBoardLines(b) {
    var lines = [];
    var r, c;
    for (r = 0; r < SIZE; r++) lines.push({ dir: "horizontal", cells: collectLine(b, r, 0, 0, 1) });
    for (c = 0; c < SIZE; c++) lines.push({ dir: "vertical", cells: collectLine(b, 0, c, 1, 0) });
    for (r = 0; r < SIZE; r++) lines.push({ dir: "diagonal ↘", cells: collectLine(b, r, 0, 1, 1) });
    for (c = 1; c < SIZE; c++) lines.push({ dir: "diagonal ↘", cells: collectLine(b, 0, c, 1, 1) });
    for (r = 0; r < SIZE; r++) lines.push({ dir: "diagonal ↙", cells: collectLine(b, r, SIZE - 1, 1, -1) });
    for (c = SIZE - 2; c >= 0; c--) lines.push({ dir: "diagonal ↙", cells: collectLine(b, 0, c, 1, -1) });
    return lines;
  }

  function formatCells(cells) {
    return cells.map(function (p) {
      return humanCell(p.r, p.c) + "=" + (p.v || ".");
    }).join(" ");
  }

  function windowThrough(b, r, c, dr, dc, rad) {
    var parts = [];
    for (var k = -rad; k <= rad; k++) {
      var nr = r + dr * k, nc = c + dc * k;
      if (!inBounds(nr, nc)) { parts.push("#"); continue; }
      var v = b[nr][nc] || ".";
      if (k === 0) v = "(" + v + ")";
      parts.push(humanCell(nr, nc) + "=" + v);
    }
    return parts.join(" ");
  }

  function linesThroughStone(b, r, c) {
    return [
      "horizontal  " + windowThrough(b, r, c, 0, 1, 5),
      "vertical    " + windowThrough(b, r, c, 1, 0, 5),
      "diagonal ↘  " + windowThrough(b, r, c, 1, 1, 5),
      "diagonal ↙  " + windowThrough(b, r, c, 1, -1, 5)
    ];
  }

  function winPattern(b, r, c, who) {
    for (var k = 0; k < 4; k++) {
      var dr = DIRS4[k][0], dc = DIRS4[k][1];
      if (lineInfo(b, r, c, dr, dc, who).total < WIN) continue;
      var cells = [];
      var i, nr, nc;
      for (i = -4; i <= 4; i++) {
        nr = r + dr * i;
        nc = c + dc * i;
        if (!inBounds(nr, nc)) continue;
        cells.push({ r: nr, c: nc, v: (i === 0 ? "." : (b[nr][nc] || ".")) });
      }
      return dirName(dr, dc) + "  " + formatCells(cells);
    }
    return null;
  }

  // Named live/dead lines. This is the briefing the classifier should trust over the crowd.
  function scanThreatLedger(b) {
    var xFives = [], oFives = [], xLive = [], oLive = [], xRush = [], oRush = [];
    var xThrees = [], oThrees = [], xSleep = [], oSleep = [], dead = [];
    var seen = {};
    function mark(kind, who, dir, a, z, extra) {
      var id = kind + who + dir + a.r + "," + a.c + "-" + z.r + "," + z.c;
      if (seen[id]) return;
      seen[id] = 1;
      var rec = { kind: kind, who: who, dir: dir, a: a, z: z, extra: extra || "" };
      if (kind === "five") (who === "X" ? xFives : oFives).push(rec);
      else if (kind === "live-four") (who === "X" ? xLive : oLive).push(rec);
      else if (kind === "rush-four") (who === "X" ? xRush : oRush).push(rec);
      else if (kind === "live-three") (who === "X" ? xThrees : oThrees).push(rec);
      else if (kind === "sleep-three") (who === "X" ? xSleep : oSleep).push(rec);
      else if (kind === "dead-four") dead.push(rec);
    }
    var lines = allBoardLines(b);
    var li, whoi, who, cells, i, j, len, leftOpen, rightOpen, leftCell, rightCell;
    for (li = 0; li < lines.length; li++) {
      cells = lines[li].cells;
      for (whoi = 0; whoi < 2; whoi++) {
        who = whoi ? "X" : "O";
        i = 0;
        while (i < cells.length) {
          if (cells[i].v !== who) { i++; continue; }
          j = i;
          while (j < cells.length && cells[j].v === who) j++;
          len = j - i;
          leftOpen = i > 0 && cells[i - 1].v === ".";
          rightOpen = j < cells.length && cells[j].v === ".";
          leftCell = leftOpen ? cells[i - 1] : null;
          rightCell = rightOpen ? cells[j] : null;
          if (len >= 5) mark("five", who, lines[li].dir, cells[i], cells[j - 1], "already on board");
          else if (len === 4 && leftOpen && rightOpen) {
            mark("live-four", who, lines[li].dir, cells[i], cells[j - 1],
              "open ends " + humanCell(leftCell.r, leftCell.c) + " and " + humanCell(rightCell.r, rightCell.c));
          } else if (len === 4 && (leftOpen || rightOpen)) {
            var end = leftCell || rightCell;
            mark("rush-four", who, lines[li].dir, cells[i], cells[j - 1],
              "block " + humanCell(end.r, end.c));
          } else if (len === 4) {
            mark("dead-four", who, lines[li].dir, cells[i], cells[j - 1], "both ends blocked — ignore");
          } else if (len === 3 && leftOpen && rightOpen) {
            mark("live-three", who, lines[li].dir, cells[i], cells[j - 1],
              "ends " + humanCell(leftCell.r, leftCell.c) + ", " + humanCell(rightCell.r, rightCell.c));
          } else if (len === 3 && (leftOpen || rightOpen)) {
            var openEnd = leftCell || rightCell;
            mark("sleep-three", who, lines[li].dir, cells[i], cells[j - 1],
              "open at " + humanCell(openEnd.r, openEnd.c) + " — one stone makes a rush four");
          }
          i = j;
        }
      }
    }
    return {
      xFives: xFives, oFives: oFives, xLive: xLive, oLive: oLive,
      xRush: xRush, oRush: oRush, xThrees: xThrees, oThrees: oThrees,
      xSleep: xSleep, oSleep: oSleep, dead: dead
    };
  }

  function ledgerLine(rec) {
    return rec.dir + " " + humanCell(rec.a.r, rec.a.c) + "–" + humanCell(rec.z.r, rec.z.c) +
      (rec.extra ? " (" + rec.extra + ")" : "");
  }

  function legalCells(b) {
    var cells = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!b[r][c]) cells.push({ r: r, c: c, key: humanCell(r, c) });
    return cells;
  }

  function parseKey(key) {
    var m = /^r(\d+)c(\d+)$/i.exec(String(key || "").trim());
    if (!m) return null;
    var r = parseInt(m[1], 10), c = parseInt(m[2], 10);
    if (!Number.isInteger(r) || !Number.isInteger(c)) return null;
    if (r < 0 || r > 14 || c < 0 || c > 14) return null;
    return { r: r, c: c };
  }

  function getPath(obj, keys) {
    var cur = obj;
    for (var i = 0; i < keys.length; i++) {
      if (cur == null || typeof cur !== "object") return undefined;
      cur = cur[keys[i]];
    }
    return cur;
  }

  // Robust choice/probabilities/confidence extraction for both backends:
  // classifier.dev answers { results: [{ label, confidence, scores }] },
  // Jev (TypeSafe) answers answers.next_move.{ choice, probabilities, confidence }.
  function firstResult(data) {
    var r = getPath(data, ["results", 0]) || getPath(data, ["result"]);
    if (r && typeof r === "object") return r;
    return null;
  }

  function extractChoice(data) {
    var fr = firstResult(data);
    if (fr && typeof fr.label === "string" && fr.label) return fr.label.trim();
    if (typeof data.label === "string" && data.label) return data.label.trim();
    var paths = [
      ["answers", "next_move", "choice"],
      ["answers", "nextMove", "choice"],
      ["answer", "next_move", "choice"],
      ["data", "answers", "next_move", "choice"],
      ["result", "answers", "next_move", "choice"],
      ["next_move", "choice"],
      ["nextMove", "choice"],
      ["choice"]
    ];
    for (var i = 0; i < paths.length; i++) {
      var v = getPath(data, paths[i]);
      if (typeof v === "string" && v) return v.trim();
    }
    // Alternate field names some APIs use.
    var altPaths = [
      ["answers", "next_move", "selected"],
      ["answers", "next_move", "value"],
      ["answers", "next_move", "option"],
      ["answers", "next_move", "key"]
    ];
    for (var j = 0; j < altPaths.length; j++) {
      var w = getPath(data, altPaths[j]);
      if (typeof w === "string" && w) return w.trim();
    }
    return null;
  }

  function extractProbabilities(data) {
    var fr = firstResult(data);
    if (fr && fr.scores && typeof fr.scores === "object") return fr.scores;
    if (data.scores && typeof data.scores === "object") return data.scores;
    var paths = [
      ["answers", "next_move", "probabilities"],
      ["answers", "nextMove", "probabilities"],
      ["next_move", "probabilities"],
      ["answers", "next_move", "probs"],
      ["probabilities"]
    ];
    for (var i = 0; i < paths.length; i++) {
      var v = getPath(data, paths[i]);
      if (v && typeof v === "object") return v;
    }
    return null;
  }

  function extractConfidence(data) {
    var fr = firstResult(data);
    if (fr && (typeof fr.confidence === "number" || typeof fr.confidence === "string")) return fr.confidence;
    if (typeof data.confidence === "number" || typeof data.confidence === "string") return data.confidence;
    var paths = [
      ["answers", "next_move", "confidence"],
      ["answers", "nextMove", "confidence"],
      ["next_move", "confidence"],
      ["confidence"]
    ];
    for (var i = 0; i < paths.length; i++) {
      var v = getPath(data, paths[i]);
      if (typeof v === "number" || typeof v === "string") return v;
    }
    return null;
  }

  // ---- Briefing layer: the harness analyzes, the classifier decides ----
  // Local tactics write a coach-style prompt (ledger, line scans, contrastive
  // labels). The listed choice is always played. Fallback is only for
  // missing/malformed/occupied replies — never to "fix" a legal ignore.
  var MAX_OPTIONS = 12;
  var MAX_TRAPS = 4;
  // The prompt names the selected classifier (combo box), so the model
  // answers in that role regardless of which backend is active.
  function baseInstructions() {
    return "You are " + classifierName() + ", playing O in five-in-a-row (Gomoku) on a 15×15 board. Place exactly one stone.\n\nCoordinates are 0-based and match the board legend: R0C0 is top-left, R14C14 is bottom-right. Option keys are R{row}C{col}.\n\nThe threat ledger below is computed and correct. Trust it over how busy the center looks. A live three on the edge of the group beats a blocked four in the crowd.\n\nDecision protocol:\n1. If any option WINS O now, pick it.\n2. If any option is MUST BLOCK, pick one of those keys. Any other key loses immediately.\n3. Never pick a key whose label starts with LOSES.\n4. Stop X live fours, then live threes — including on the flank.\n5. Ignore lines marked DEAD (both ends blocked; a five cannot fit).\n6. Prefer forks (two threats at once).\n7. Stay near existing stones.";
  }

  function dirName(dr, dc) {
    if (dr === 0 && dc === 1) return "horizontal";
    if (dr === 1 && dc === 0) return "vertical";
    if (dr === 1 && dc === 1) return "diagonal ↘";
    return "diagonal ↙";
  }

  // Count stones of `who` through (r,c) along (dr,dc), assuming (r,c) becomes `who`.
  function lineInfo(b, r, c, dr, dc, who) {
    var pos = 0, nr = r + dr, nc = c + dc;
    while (inBounds(nr, nc) && b[nr][nc] === who) { pos++; nr += dr; nc += dc; }
    var posOpen = inBounds(nr, nc) && !b[nr][nc];
    var neg = 0;
    nr = r - dr; nc = c - dc;
    while (inBounds(nr, nc) && b[nr][nc] === who) { neg++; nr -= dr; nc -= dc; }
    var negOpen = inBounds(nr, nc) && !b[nr][nc];
    return { total: 1 + pos + neg, open: (posOpen ? 1 : 0) + (negOpen ? 1 : 0) };
  }

  // Gap-pattern vision: sliding 5-window over an 11-cell line with (r,c)
  // simulated as `who`. Catches broken fours (e.g. SS_SS) and open threes
  // that contiguous counting undervalues.
  function windowBest(b, r, c, dr, dc, who) {
    var ch = [];
    for (var k = -5; k <= 5; k++) {
      if (k === 0) { ch.push("S"); continue; }
      var nr = r + dr * k, nc = c + dc * k;
      if (!inBounds(nr, nc)) { ch.push("#"); continue; }
      var v = b[nr][nc];
      ch.push(v === who ? "S" : (!v ? "." : "#"));
    }
    var out = { five: false, four: false, openFour: false, openThree: false, three: false };
    for (var s = 1; s <= 5; s++) {
      var cntS = 0, cntD = 0, bad = false;
      for (var j = 0; j < 5; j++) {
        if (ch[s + j] === "S") cntS++;
        else if (ch[s + j] === ".") cntD++;
        else { bad = true; break; }
      }
      if (bad) continue;
      if (cntS === 5) out.five = true;
      else if (cntS === 4 && cntD === 1) {
        out.four = true;
        if (ch[s - 1] === "." && ch[s + 5] === ".") out.openFour = true;
      } else if (cntS === 3 && cntD === 2) {
        out.three = true;
        if (ch[s - 1] === "." && ch[s + 5] === ".") out.openThree = true;
      }
    }
    return out;
  }

  function nearestDist(b, r, c) {
    var best = 99;
    for (var rr = 0; rr < SIZE; rr++) {
      for (var cc = 0; cc < SIZE; cc++) {
        if (b[rr][cc]) {
          var d = Math.max(Math.abs(rr - r), Math.abs(cc - c));
          if (d < best) best = d;
          if (best <= 1) return best;
        }
      }
    }
    return best;
  }

  var DIRS4 = [[0, 1], [1, 0], [1, 1], [1, -1]];

  function uniquePts(pts) {
    var seen = {}, out = [];
    for (var i = 0; i < pts.length; i++) {
      var k = pts[i].r + "," + pts[i].c;
      if (!seen[k]) { seen[k] = 1; out.push(pts[i]); }
    }
    return out;
  }

  // 5-windows through (r,c) on one line. Empty cells that complete a five
  // (board already has `who` at r,c). Opponent/wall windows are skipped, so
  // blocked "fours" that can never become five score as dead.
  function winPointsDir(b, r, c, dr, dc, who) {
    var pts = [];
    for (var t = 0; t < 5; t++) {
      var empty = null, stones = 0, ok = true;
      for (var j = 0; j < 5; j++) {
        var nr = r + (j - t) * dr, nc = c + (j - t) * dc;
        if (!inBounds(nr, nc)) { ok = false; break; }
        var v = b[nr][nc];
        if (v === who) stones++;
        else if (!v) {
          if (empty) { ok = false; break; }
          empty = { r: nr, c: nc };
        } else { ok = false; break; }
      }
      if (!ok) continue;
      if (stones === 4 && empty) pts.push(empty);
    }
    return uniquePts(pts);
  }

  // Classify placing `who` at empty (r,c): five / live four / rush four /
  // live three / sleep three. Live four = two or more distinct winning replies
  // (.XXXX.). Rush four = exactly one. Live three = a follow-up on the same
  // line that would create a live four.
  function classifyPlace(b, r, c, who) {
    var prev = b[r][c];
    b[r][c] = who;
    var five = false, fiveDir = null;
    var liveFour = false, rushFour = false, brokenFour = false;
    var liveThreeDirs = 0, sleepThreeDirs = 0, threatDirs = 0;
    var maxRun = 1, openEnds = 0, bestDir = dirName(0, 1);
    for (var k = 0; k < 4; k++) {
      var dr = DIRS4[k][0], dc = DIRS4[k][1];
      var ro = lineInfo(b, r, c, dr, dc, who);
      if (ro.total > maxRun || (ro.total === maxRun && ro.open > openEnds)) {
        maxRun = ro.total;
        openEnds = ro.open;
        bestDir = dirName(dr, dc);
      }
      if (ro.total >= WIN) {
        five = true;
        if (!fiveDir) fiveDir = dirName(dr, dc);
      }
      var wpts = winPointsDir(b, r, c, dr, dc, who);
      var live4 = wpts.length >= 2;
      var rush4 = wpts.length === 1;
      if (live4) liveFour = true;
      if (rush4) rushFour = true;
      if ((live4 || rush4) && ro.total < 4) brokenFour = true;
      var live3 = false, sleep3 = false;
      if (!five && !live4 && !rush4) {
        for (var step = -4; step <= 4; step++) {
          if (step === 0) continue;
          var er = r + dr * step, ec = c + dc * step;
          if (!inBounds(er, ec) || b[er][ec]) continue;
          b[er][ec] = who;
          var w2 = winPointsDir(b, er, ec, dr, dc, who);
          b[er][ec] = "";
          if (w2.length >= 2) { live3 = true; break; }
          if (w2.length === 1) sleep3 = true;
        }
      }
      if (live3) liveThreeDirs++;
      else if (sleep3) sleepThreeDirs++;
      if (live4 || rush4 || live3) threatDirs++;
    }
    b[r][c] = prev;
    return {
      five: five,
      fiveDir: fiveDir,
      liveFour: liveFour,
      rushFour: rushFour,
      brokenFour: brokenFour,
      liveThree: liveThreeDirs > 0,
      liveThreeCount: liveThreeDirs,
      sleepThree: sleepThreeDirs > 0,
      threatDirs: threatDirs,
      maxRun: maxRun,
      openEnds: openEnds,
      bestDir: bestDir,
      fork: threatDirs >= 2
    };
  }

  function evalCell(b, r, c) {
    var o = classifyPlace(b, r, c, "O");
    var x = classifyPlace(b, r, c, "X");
    return {
      oMax: o.maxRun, oOpen: o.openEnds, oDir: o.bestDir,
      xMax: x.maxRun, xOpen: x.openEnds, xDir: x.bestDir,
      oWin: o.five, xWin: x.five,
      oWinDir: o.fiveDir, xWinDir: x.fiveDir,
      oThreats: o.threatDirs, xThreats: x.threatDirs,
      doubleO: o.fork, doubleX: x.fork,
      oGapFour: o.brokenFour, xGapFour: x.brokenFour,
      oOpenThree: o.liveThree, xOpenThree: x.liveThree,
      oLiveFour: o.liveFour, xLiveFour: x.liveFour,
      oRushFour: o.rushFour, xRushFour: x.rushFour,
      oLiveThreeCount: o.liveThreeCount, xLiveThreeCount: x.liveThreeCount,
      allowsXWin: null,
      allowsXForce: null,
      dist: nearestDist(b, r, c)
    };
  }

  function findWinningCells(b, who) {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        var ok = false;
        for (var k = 0; k < 4; k++) {
          if (lineInfo(b, r, c, DIRS4[k][0], DIRS4[k][1], who).total >= WIN) { ok = true; break; }
        }
        if (ok) out.push({ r: r, c: c, key: humanCell(r, c) });
      }
    }
    return out;
  }

  // After O has already moved (X to play): a single X stone that wins now,
  // makes a live four, makes a four-three, or makes two live threes.
  function xForcedAfter(b) {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        if (nearestDist(b, r, c) > 2) continue;
        var cl = classifyPlace(b, r, c, "X");
        var key = humanCell(r, c);
        if (cl.five) return { kind: "five", key: key };
        if (cl.liveFour) return { kind: "live-four", key: key };
        if (cl.rushFour && cl.liveThree) return { kind: "four-three", key: key };
        if (cl.liveThreeCount >= 2) return { kind: "three-three", key: key };
      }
    }
    return null;
  }

  function scoreCell(ev) {
    if (ev.oWin) return 100000;
    if (ev.xWin) return 90000;
    var s = 0;
    // Live four = two winning replies; rush/broken four = one. Closed fours that
    // cannot become five are not counted by classifyPlace, so they stay quiet.
    if (ev.oLiveFour) s += 25000;
    else if (ev.oRushFour || ev.oGapFour) s += 12000;
    else if (ev.oOpenThree) s += 5000;
    else if (ev.oMax === 3) s += ev.oOpen === 2 ? 2000 : 800;
    else if (ev.oMax === 2 && ev.oOpen > 0) s += 400;
    if (ev.xLiveFour) s += 22000;
    else if (ev.xRushFour || ev.xGapFour) s += 11000;
    else if (ev.xOpenThree) s += 4500;
    else if (ev.xMax === 3) s += ev.xOpen === 2 ? 1800 : 600;
    else if (ev.xMax === 2 && ev.xOpen > 0) s += 300;
    if (ev.doubleO) s += 8000;
    if (ev.doubleX) s += 7000;
    if (ev.allowsXWin && ev.allowsXWin.length) s -= 20000;
    if (ev.allowsXForce && ev.allowsXForce.length) s -= 15000;
    if (ev.dist <= 1) s += 200;
    else if (ev.dist === 2) s += 50;
    else s -= 5000;
    return s;
  }

  // Tactical tiers for presentation. Numeric scores stay internal (sort only):
  // S = forced win/block, A = live/rush four or fork, B = live three, C = rest.
  function tierOf(ev) {
    if (ev.oWin || ev.xWin) return "S";
    if (ev.oLiveFour || ev.xLiveFour || ev.oRushFour || ev.xRushFour ||
        ev.oGapFour || ev.xGapFour || ev.doubleO || ev.doubleX) return "A";
    if (ev.oOpenThree || ev.xOpenThree || ev.oMax === 3 || ev.xMax === 3) return "B";
    return "C";
  }

  // One-line tactical description. Avoid-moves are relabeled by the caller.
  function labelCell(r, c, ev) {
    if (ev.oWin && ev.xWin) return "WINS O now and MUST BLOCK X five";
    if (ev.oWin) return "WINS O now — take this";
    if (ev.xWin) return "MUST BLOCK X five on " + (ev.xWinDir || "this line") + ". Any other key loses immediately.";
    var parts = [];
    if (ev.oLiveFour) parts.push("Creates LIVE four (forced)");
    if (ev.xLiveFour) parts.push("Stops X live three (prevents live four)");
    if (ev.oRushFour && !ev.oLiveFour) parts.push(ev.oGapFour ? "Creates broken four" : "Creates rush four");
    else if (ev.oGapFour && !ev.oLiveFour) parts.push("Creates broken four");
    if (ev.xRushFour && !ev.xLiveFour) parts.push(ev.xGapFour ? "Blocks X broken four" : "Blocks X rush four");
    else if (ev.xGapFour && !ev.xLiveFour) parts.push("Blocks X broken four");
    if (ev.doubleO) parts.push("O fork");
    if (ev.doubleX) parts.push("blocks X fork");
    if (ev.oOpenThree && !ev.oLiveFour && !ev.oRushFour) parts.push("Creates live three");
    if (ev.xOpenThree && !ev.xLiveFour && !ev.xRushFour) parts.push("Blocks X live three");
    if (!parts.length) {
      if (ev.oMax >= 3) parts.push("Extends O");
      else if (ev.xMax >= 3) parts.push("Covers X");
      else parts.push("Positional move");
    }
    return parts.join(" + ");
  }

  // ---- Presentation layer: summary, PV, tiers (analysis above is untouched) ----

  // Single-move attack strength for `who` placed at (r,c), reusing lineInfo
  // and windowBest. Scale: 5000+ five, 4000+ four, 3500+ broken four,
  // 3000+ open three, 2000+ three, 1000+ two.
  function attackStrength(b, r, c, who) {
    var best = 0;
    for (var k = 0; k < 4; k++) {
      var li = lineInfo(b, r, c, DIRS4[k][0], DIRS4[k][1], who);
      var wb = windowBest(b, r, c, DIRS4[k][0], DIRS4[k][1], who);
      var s = li.total * 1000 + li.open * 100;
      if (wb.four && li.total < 4) s += 500;
      if (wb.openThree) s += 200;
      if (s > best) best = s;
    }
    return best;
  }

  function levelName(s) {
    if (s >= 5000) return "five";
    if (s >= 4000) return "four";
    if (s >= 3500) return "broken four";
    if (s >= 3000) return "open three";
    if (s >= 2000) return "three";
    if (s >= 1000) return "two";
    return "quiet";
  }

  // Strongest attacking reply for `who` on board b (near-stone empties only).
  function bestAttackCell(b, who) {
    var best = null;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        if (nearestDist(b, r, c) > 2) continue;
        var s = attackStrength(b, r, c, who);
        if (!best || s > best.s) best = { r: r, c: c, key: humanCell(r, c), s: s };
      }
    }
    return best;
  }

  // Principal variation for one O candidate: O move, strongest X reply,
  // strongest O continuation — all from existing local evaluation, no API.
  function pvFor(b, cand) {
    if (cand.ev.oWin) return "PV: O " + cand.key + " wins immediately.";
    var s1 = [];
    for (var i = 0; i < SIZE; i++) s1.push(b[i].slice());
    s1[cand.r][cand.c] = "O";
    var xw = findWinningCells(s1, "X");
    if (xw.length) return "PV: O " + cand.key + ", X " + xw[0].key + " wins immediately — O's move fails.";
    var xr = bestAttackCell(s1, "X");
    if (!xr) return "PV: O " + cand.key + " (board full).";
    s1[xr.r][xr.c] = "X";
    var ow = findWinningCells(s1, "O");
    if (ow.length) return "PV: O " + cand.key + ", X " + xr.key + ", O " + ow[0].key + " wins.";
    var oc = bestAttackCell(s1, "O");
    var oS = oc ? oc.s : 0;
    var res = oS > xr.s ? "O keeps initiative" : oS < xr.s ? "X keeps initiative" : "balanced";
    return "PV: O " + cand.key + ", X " + xr.key + ", O " + (oc ? oc.key : "—") +
      " — O " + levelName(oS) + " vs X " + levelName(xr.s) + ", " + res + ".";
  }

  // 0-based critical-area box, e.g. "R6–R8, C5–C8".
  function bboxArea(cells) {
    if (!cells.length) return null;
    var r0 = 99, r1 = -1, c0 = 99, c1 = -1, i;
    for (i = 0; i < cells.length; i++) {
      if (cells[i].r < r0) r0 = cells[i].r;
      if (cells[i].r > r1) r1 = cells[i].r;
      if (cells[i].c < c0) c0 = cells[i].c;
      if (cells[i].c > c1) c1 = cells[i].c;
    }
    var rs = r0 === r1 ? "R" + r0 : "R" + r0 + "–R" + r1;
    var cs = c0 === c1 ? "C" + c0 : "C" + c0 + "–C" + c1;
    return rs + ", " + cs;
  }

  function stonesOf(b) {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) out.push({ r: r, c: c });
      }
    }
    return out;
  }

  function buildSummary(b, cands, oWins, xWins, xBuilds, ledger) {
    var focus;
    if (oWins.length) focus = "attack — take the win now";
    else if (xWins.length) focus = "defend — block X's win first";
    else if (ledger && ledger.xLive.length) focus = "defend — X already has a live four";
    else if (ledger && ledger.xThrees.length) focus = "defend the live three, including on the flank";
    else if (xBuilds.length) focus = "defend first, then build a fork";
    else if (ledger && (ledger.oLive.length || ledger.oRush.length)) focus = "attack — extend the threat or build a fork";
    else focus = "develop near existing stones";
    var hot = oWins.concat(xWins).concat(xBuilds.slice(0, 6));
    var L = ["THREAT LEDGER (computed, trust this):"];
    if (oWins.length) {
      L.push("O can win now at " + describeKeys(oWins) + ".");
      oWins.forEach(function (w) {
        var pat = winPattern(b, w.r, w.c, "O");
        if (pat) L.push("  " + w.key + "  " + pat);
      });
    } else L.push("O has no five this turn.");
    if (xWins.length) {
      L.push("X fives (MUST BLOCK — any other key loses): " + describeKeys(xWins) + ".");
      if (xWins.length >= 2) L.push("X already has two fives (open four / double threat). Unless O wins now, the position is lost.");
      xWins.forEach(function (w) {
        var pat = winPattern(b, w.r, w.c, "X");
        if (pat) L.push("  " + w.key + "  " + pat);
      });
    } else L.push("X has no five this turn.");
    function dump(title, arr) {
      if (!arr || !arr.length) return;
      L.push(title);
      for (var i = 0; i < arr.length && i < 6; i++) L.push("  - " + ledgerLine(arr[i]));
    }
    dump("X live fours (unstoppable next unless you win now):", ledger && ledger.xLive);
    dump("O live fours:", ledger && ledger.oLive);
    dump("X rush fours (one block point):", ledger && ledger.xRush);
    dump("O rush fours:", ledger && ledger.oRush);
    dump("X live threes (block the flank — these become fours next):", ledger && ledger.xThrees);
    dump("O live threes:", ledger && ledger.oThrees);
    dump("X half-open threes (one more stone makes a rush four — contest the open end):", ledger && ledger.xSleep);
    dump("DEAD lines (both ends blocked — do not spend a move here):", ledger && ledger.dead);
    var area = bboxArea(hot.length ? hot : stonesOf(b));
    if (area) L.push("Critical area: " + area + ".");
    L.push("Strategic focus: " + focus + ".");
    return { text: L.join("\n"), focus: focus };
  }

  // Shrink: keep only near-stone tactical candidates, labeled with WHY.
  function buildLabeledCriteria(b) {
    var xWins = findWinningCells(b, "X");
    var oWins = findWinningCells(b, "O");
    var cands = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        var ev = evalCell(b, r, c);
        if (ev.dist > 2 && !ev.oWin && !ev.xWin) continue; // shrink far cells (rule 5)
        var sc = scoreCell(ev);
        cands.push({ r: r, c: c, key: humanCell(r, c), ev: ev, score: sc, rawScore: sc });
      }
    }
    var ledger = scanThreatLedger(b);
    cands.sort(function (a, b2) { return b2.score - a.score; });
    var picked = cands.slice(0, 40);
    // Guarantee key cells survive the cap, keeping their natural rank —
    // wins score as wins (100000/90000), builds keep their candidate score.
    function ensure(list) {
      for (var i = 0; i < list.length; i++) {
        var found = false;
        for (var j = 0; j < picked.length; j++) {
          if (picked[j].key === list[i].key) { found = true; break; }
        }
        if (!found && picked.length < 255) {
          var w = list[i];
          if (w.ev) { picked.push(w); continue; }
          var lev = evalCell(b, w.r, w.c);
          var scw = scoreCell(lev);
          picked.push({ r: w.r, c: w.c, key: w.key, ev: lev, score: scw, rawScore: scw });
        }
      }
    }
    ensure(oWins);
    ensure(xWins);
    function xBuildStrength(ev) {
      if (ev.xWin) return 100000;
      if (ev.xLiveFour) return 22000;
      if (ev.xRushFour || ev.xGapFour) return 11000;
      if (ev.xOpenThree) return 4500;
      if (ev.xMax === 3) return ev.xOpen === 2 ? 1800 : 600;
      return 0;
    }
    var xBuilds = cands
      .filter(function (cd) { return xBuildStrength(cd.ev) >= 1500; })
      .sort(function (a, b2) { return xBuildStrength(b2.ev) - xBuildStrength(a.ev); })
      .slice(0, 8);
    ensure(xBuilds);
    // 2-ply: if X already has an immediate win, any O move that does not
    // block it hangs the loss.
    if (xWins.length) {
      for (var t = 0; t < picked.length; t++) {
        var pc = picked[t];
        if (!pc.ev.oWin && !pc.ev.xWin) {
          var sim = [];
          for (var sr = 0; sr < SIZE; sr++) sim.push(b[sr].slice());
          sim[pc.r][pc.c] = "O";
          var reply = findWinningCells(sim, "X");
          if (reply.length) {
            pc.ev.allowsXWin = reply.slice(0, 3).map(function (w) { return w.key; });
            pc.score = scoreCell(pc.ev);
          }
        }
      }
    }
    // 3/4-ply: no immediate X five, but this O move may allow a live four,
    // four-three, or three-three that O cannot stop.
    if (!oWins.length && !xWins.length) {
      for (var u = 0; u < picked.length; u++) {
        var pu = picked[u];
        if (pu.ev.oWin || pu.ev.allowsXWin) continue;
        var s1 = [];
        for (var a1 = 0; a1 < SIZE; a1++) s1.push(b[a1].slice());
        s1[pu.r][pu.c] = "O";
        var force = xForcedAfter(s1);
        if (force) {
          pu.ev.allowsXForce = [force.kind + "@" + force.key];
          pu.score = scoreCell(pu.ev);
        }
      }
    }
    picked.sort(function (a, b2) { return b2.score - a.score; });
    if (!picked.length) {
      var free = legalCells(b).slice(0, MAX_OPTIONS);
      for (var f = 0; f < free.length; f++) {
        var fev = evalCell(b, free[f].r, free[f].c);
        picked.push({ r: free[f].r, c: free[f].c, key: free[f].key, ev: fev, score: 0, rawScore: 0 });
      }
    }
    function isAvoid(cell) {
      return (cell.ev.allowsXWin && cell.ev.allowsXWin.length) ||
             (cell.ev.allowsXForce && cell.ev.allowsXForce.length);
    }
    // The classifier must still choose: keep real alternatives, including tempting
    // LOSES moves so the briefing can argue against them.
    var keep = [], traps = [];
    for (var ti = 0; ti < picked.length; ti++) {
      if (isAvoid(picked[ti]) && !picked[ti].ev.oWin && !picked[ti].ev.xWin) traps.push(picked[ti]);
      else keep.push(picked[ti]);
    }
    var offered = keep.slice(0, MAX_OPTIONS);
    function inOffered(key) {
      for (var oi = 0; oi < offered.length; oi++) if (offered[oi].key === key) return true;
      return false;
    }
    for (var ei = 0; ei < picked.length; ei++) {
      if ((picked[ei].ev.oWin || picked[ei].ev.xWin) && !inOffered(picked[ei].key)) {
        offered.push(picked[ei]);
      }
    }
    traps.sort(function (a, b2) { return (b2.rawScore || 0) - (a.rawScore || 0); });
    for (var tr = 0; tr < traps.length && tr < MAX_TRAPS; tr++) {
      if (!inOffered(traps[tr].key)) offered.push(traps[tr]);
    }
    offered.sort(function (a, b2) { return b2.score - a.score; });
    picked = offered;
    var summary = buildSummary(b, cands, oWins, xWins, xBuilds, ledger);
    var pvMap = {};
    var pvN = Math.min(6, picked.length);
    for (var q = 0; q < pvN; q++) pvMap[picked[q].key] = pvFor(b, picked[q]);
    var criteria = {};
    for (var p = 0; p < picked.length; p++) {
      var cell = picked[p], evp = cell.ev;
      var avoid = null;
      if (evp.allowsXWin && evp.allowsXWin.length) {
        avoid = "LOSES NOW. X still completes five at " + evp.allowsXWin.join(", ") +
          ". This key does not cover that five.";
      } else if (evp.allowsXForce && evp.allowsXForce.length) {
        avoid = "LOSES. X forced win (" + evp.allowsXForce[0] +
          "). A live flank line survives this move.";
      }
      var tier = avoid ? "C" : tierOf(evp);
      var val = "Tier " + tier + " #" + (p + 1) + " — " +
        (avoid ? avoid : labelCell(cell.r, cell.c, evp));
      if (pvMap[cell.key]) val += "\n" + pvMap[cell.key];
      criteria[cell.key] = val;
    }
    return {
      criteria: criteria, xWins: xWins, oWins: oWins, xBuilds: xBuilds,
      picked: picked, summary: summary, ledger: ledger
    };
  }

  function describeKeys(list) {
    return list.map(function (w) { return humanCell(w.r, w.c); }).join(", ");
  }

  function buildInstructions(analyzed) {
    var s = baseInstructions();
    s += "\n\nPick exactly one listed key. Ranked Tier S (win/block) > A (live/rush four or fork) > B (live three) > C (positional). #1 is strongest.";
    s += "\n\n" + analyzed.summary.text;
    s += "\n\nPrevious turn:\n- " + classifierName() + ": " + (memJev || "none yet") +
      "\n- Human: " + (memHuman || "none yet") +
      "\n- Previous plan: " + (memPlan || "none yet");
    if (lastMove && lastMove.who === "X") {
      s += "\n\nLines through last human stone " + humanCell(lastMove.r, lastMove.c) + " (the stone just played):\n  " +
        linesThroughStone(board, lastMove.r, lastMove.c).join("\n  ");
    }
    if (analyzed.oWins.length) {
      s += "\n\nLOCK — YOU CAN WIN NOW. Choose one of: " + describeKeys(analyzed.oWins) + ".";
    } else if (analyzed.xWins.length) {
      s += "\n\nLOCK — YOU MUST BLOCK NOW. Choose one of: " + describeKeys(analyzed.xWins) +
        ". Every LOSES key in the list is a trap that leaves that five on the board.";
    } else if (analyzed.ledger && (analyzed.ledger.xThrees.length || analyzed.ledger.xSleep.length)) {
      s += "\n\nHINT — X has a live or half-open three. Block its open end(s) before it becomes a four. Flank lines first, not the dead center.";
    } else if (analyzed.xBuilds && analyzed.xBuilds.length) {
      s += "\n\nHINT — X is building around " + describeKeys(analyzed.xBuilds.slice(0, 3)) +
        ". Contest those squares. A live three on the flank beats a dead fight in the crowded center.";
    } else {
      s += "\n\nHINT — no immediate five. Best Tier A/B attack or fork, stay near stones.";
    }
    return s;
  }

  function bestLegalFromProbabilities(probs, b, allowed) {
    if (!probs || typeof probs !== "object") return null;
    var best = null, bestP = -Infinity;
    function consider(key, p) {
      var pos = parseKey(key);
      if (!pos) return;
      if (b[pos.r][pos.c]) return; // occupied
      var ck = humanCell(pos.r, pos.c);
      if (allowed && !Object.prototype.hasOwnProperty.call(allowed, ck)) return;
      var num = Number(p);
      if (!isFinite(num)) return;
      if (num > bestP) { bestP = num; best = pos; }
    }
    if (Array.isArray(probs)) {
      for (var i = 0; i < probs.length; i++) {
        var e = probs[i];
        if (e == null) continue;
        if (typeof e === "string") continue;
        if (typeof e === "object") {
          var k = e.key || e.option || e.choice || e.name || e.label;
          var p = e.probability != null ? e.probability : (e.prob != null ? e.prob : e.p);
          if (k) consider(k, p);
        }
      }
    } else {
      Object.keys(probs).forEach(function (k) { consider(k, probs[k]); });
    }
    return best;
  }

  function requestOppMove(myGameId) {
    var cfg = classifierCfg();
    var name = cfg.name;
    var isJev = selectedClassifier() === "jev";
    var analyzed = buildLabeledCriteria(board);
    var criteria = analyzed.criteria;
    var labels = Object.keys(criteria);

    // classifier.dev requires 2–100 labels. With 0–1 legal moves there is
    // nothing to choose — play it locally instead of sending a bad request.
    // (Jev accepts any count, but the local move is identical either way.)
    if (labels.length < 2) {
      var only = analyzed.picked.length ? analyzed.picked[0] : (legalCells(board)[0] || null);
      if (!only) {
        waiting = false; winner = "Draw"; gameLive = false;
        renderStatus({ warn: "Board is full — draw." });
        return;
      }
      board[only.r][only.c] = "O";
      lastMove = { r: only.r, c: only.c, who: "O" };
      lastJevCell = humanCell(only.r, only.c);
      lastJevRC = { r: only.r, c: only.c };
      memJev = lastJevCell;
      memPlan = analyzed.summary.focus;
      var onlyLine = checkWin(board, only.r, only.c, "O");
      waiting = false;
      if (onlyLine) { winner = "O"; winningLine = onlyLine; gameLive = false; }
      else if (boardFull(board)) { winner = "Draw"; gameLive = false; }
      renderStatus({ warn: "Only one legal cell — played " + lastJevCell + " locally (no request sent)." });
      return;
    }

    var briefing = buildInstructions(analyzed);
    var url = classifierUrl();
    var body, headers, reqHead;
    if (isJev) {
      // Jev (TypeSafe AI): choice question over the labeled criteria.
      var key = apiKeyEl.value; // memory + input only; never stored/logged
      if (!key || !key.trim()) {
        waiting = false;
        renderStatus({ error: "Missing API key: paste your TypeSafe API key first. No request was sent." });
        return;
      }
      body = {
        model: "jev-latest", // fixed default; no UI override
        state: {
          game: "five-in-a-row",
          win_length: 5,
          to_move: "O",
          coordinate_system: "0-based, R0C0 top-left, R14C14 bottom-right, keys R{row}C{col}",
          legend: ". empty, X human, O " + name,
          last_human_move: memHuman,
          last_jev_move: memJev,
          board: boardToStrings(board),
          board_labeled: boardToLabeled(board),
          lines_through_last_human: (lastMove && lastMove.who === "X")
            ? linesThroughStone(board, lastMove.r, lastMove.c)
            : null
        },
        questions: {
          next_move: {
            type: "choice",
            instructions: briefing,
            criteria: criteria
          }
        }
      };
      headers = {
        "Authorization": "Bearer " + key,
        "Content-Type": "application/json"
      };
      reqHead = "Authorization: Bearer [REDACTED]";
    } else {
      // Classifier.dev: labels = candidate moves, input = briefing text.
      var optionLines = labels.map(function (k) { return k + ": " + criteria[k]; });
      var inputText =
        briefing +
        "\n\nBoard (0-based, R0C0 top-left, . empty, X human, O " + name + "):\n" +
        boardToLabeled(board) +
        "\n\nCandidate moves (reply with exactly one of these keys):\n" +
        optionLines.join("\n");
      // classifier.dev caps input at 32,000 chars; stay safely under.
      if (inputText.length > 30000) inputText = inputText.slice(0, 30000);
      body = {
        input: inputText,
        labels: labels,
        instructions: "You are O playing five-in-a-row (Gomoku) on 15x15. " +
          "Pick exactly one listed move key. Tier S (win/block) > A > B > C. " +
          "If a win exists take it; if the opponent has five you must block. " +
          "Never pick a LOSES key."
      };
      headers = {
        "Content-Type": "application/json"
      };
      reqHead = "Content-Type: application/json (no key)";
    }

    waiting = true;
    renderStatus({});

    exchangeCount++;
    var myExchange = exchangeCount;
    var emptyTotal = legalCells(board).length;
    var reqText = "POST " + url + "\n" + reqHead + "\nContent-Type: application/json\n\n" + pretty(body);
    renderTraffic(
      "Move #" + myExchange + ": sent " + Object.keys(criteria).length + " labeled options (" + emptyTotal + " empties) — waiting for " + name + "…",
      reqText,
      "… waiting for response …"
    );

    // NOTE: the key goes only to the configured Jev endpoint (a proxy YOU
    // control — never a random public one). classifier.dev is keyless and
    // CORS-open; the browser calls it directly.
    fetch(url, {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body)
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (t) {
          throw new Error("API error " + resp.status + " " + resp.statusText + (t ? ": " + t.slice(0, 300) : ""));
        });
      }
      return resp.json();
    }).then(function (data) {
      if (myGameId !== gameId) return; // New Game pressed while in flight
      var warn = null;
      var choice = extractChoice(data);
      var probs = extractProbabilities(data);
      var conf = extractConfidence(data);
      if (conf != null) lastConfidence = String(conf);

      var pos = choice ? parseKey(choice) : null;
      if (pos && board[pos.r][pos.c]) {
        warn = name + " chose occupied cell " + choice + "; fell back to a legal cell.";
        pos = null;
      } else if (choice && !pos) {
        warn = name + ' returned malformed choice "' + String(choice).slice(0, 40) + '"; fell back to a legal cell.';
      } else if (!choice) {
        warn = name + " response had no usable choice; fell back to a legal cell.";
      }
      if (pos) {
        var ckey = humanCell(pos.r, pos.c);
        if (!Object.prototype.hasOwnProperty.call(criteria, ckey)) {
          warn = (warn ? warn + " " : "") + name + " chose " + ckey + " outside the option list; ignoring.";
          pos = null;
        } else {
          var inList = function (list) {
            for (var li = 0; li < list.length; li++) if (list[li].key === ckey) return true;
            return false;
          };
          if (analyzed.oWins.length && !inList(analyzed.oWins)) {
            warn = (warn ? warn + " " : "") + "DEMO: " + name + " ignored WIN at " + describeKeys(analyzed.oWins) + " and played " + ckey + ".";
          } else if (!analyzed.oWins.length && analyzed.xWins.length && !inList(analyzed.xWins)) {
            warn = (warn ? warn + " " : "") + "DEMO: " + name + " ignored MUST-BLOCK at " + describeKeys(analyzed.xWins) + " and played " + ckey + ".";
          }
        }
      }

      if (!pos && probs) {
        var bp = bestLegalFromProbabilities(probs, board, criteria);
        if (bp) {
          pos = bp;
          warn = (warn ? warn + " " : "") + "Used highest-probability listed cell.";
        }
      }
      if (!pos) {
        if (analyzed.oWins.length && !board[analyzed.oWins[0].r][analyzed.oWins[0].c]) {
          pos = { r: analyzed.oWins[0].r, c: analyzed.oWins[0].c };
          warn = (warn ? warn + " " : "") + "Fallback: played local winning move " + humanCell(analyzed.oWins[0].r, analyzed.oWins[0].c) + ".";
        } else if (analyzed.xWins.length && !board[analyzed.xWins[0].r][analyzed.xWins[0].c]) {
          pos = { r: analyzed.xWins[0].r, c: analyzed.xWins[0].c };
          warn = (warn ? warn + " " : "") + "Fallback: blocked X's win at " + humanCell(analyzed.xWins[0].r, analyzed.xWins[0].c) + ".";
        } else if (analyzed.picked.length) {
          pos = { r: analyzed.picked[0].r, c: analyzed.picked[0].c };
          warn = (warn ? warn + " " : "") + "Fallback: played top tactical candidate " + humanCell(analyzed.picked[0].r, analyzed.picked[0].c) + ".";
        }
      }
      if (!pos) {
        var free = legalCells(board);
        if (!free.length) {
          waiting = false; winner = "Draw"; renderStatus({ warn: warn });
          renderTraffic("Move #" + myExchange + ": board full, draw.", reqText, "choice=" + String(choice) + "\n\n" + pretty(data));
          return;
        }
        pos = free[Math.floor(Math.random() * free.length)];
        if (!warn) warn = "No probabilities available; played a random legal cell.";
      }

      board[pos.r][pos.c] = "O";
      lastMove = { r: pos.r, c: pos.c, who: "O" };
      lastJevCell = humanCell(pos.r, pos.c);
      lastJevRC = { r: pos.r, c: pos.c };
      memJev = lastJevCell;
      memPlan = analyzed.summary.focus;
      var line = checkWin(board, pos.r, pos.c, "O");
      waiting = false;
      if (line) { winner = "O"; winningLine = line; gameLive = false; }
      else if (boardFull(board)) { winner = "Draw"; gameLive = false; }
      renderStatus({ warn: warn });
      renderTraffic(
        "Move #" + myExchange + ": " + name + " chose " + lastJevCell + (lastConfidence != null ? " (confidence " + lastConfidence + ")" : "") + (warn ? " — " + warn : ""),
        reqText,
        "choice=" + String(choice) + (lastConfidence != null ? " confidence=" + lastConfidence : "") + "\n\n" + pretty(data)
      );
    }).catch(function (err) {
      if (myGameId !== gameId) return;
      waiting = false;
      var msg = err && err.message ? err.message : String(err);
      if (err instanceof TypeError) {
        msg += isJev
          ? " (possible CORS/network block — Jev needs a proxy you control; see note at top of file)"
          : " (possible CORS/network block — classifier.dev is CORS-open, so check your connection)";
      }
      // Never logs the key: redact before console + DOM.
      if (typeof console !== "undefined" && console.error) console.error(redact(msg));
      renderStatus({ error: msg });
      renderTraffic("Move #" + myExchange + ": request failed.", reqText, "ERROR: " + redact(msg));
    });
  }

  function humanClick(r, c) {
    if (!gameLive || winner) return;
    if (waiting) return;                    // board disabled while opponent thinks
    if (!inBounds(r, c) || board[r][c]) return;
    if (classifierCfg().needsKey) {
      var key = apiKeyEl.value;
      if (!key || !key.trim()) {            // refuse to play without a key
        renderStatus({ error: "Missing API key: paste your TypeSafe API key first. No request was sent." });
        return;
      }
    }
    board[r][c] = "X";
    lastMove = { r: r, c: c, who: "X" };
    memHuman = humanCell(r, c);
    var line = checkWin(board, r, c, "X");
    if (line) {
      winner = "X"; winningLine = line; gameLive = false;
      renderStatus({});
      return;
    }
    if (boardFull(board)) {
      winner = "Draw"; gameLive = false;
      renderStatus({});
      return;
    }
    requestOppMove(gameId);
  }

  // ---- p5 ----
  // Board geometry: left/top gutter holds the R0–R14 / C0–C14 legends.
  function boardMetrics() {
    var L = Math.max(30, Math.floor(window.width * 0.075));
    var pad = Math.max(8, Math.floor(L * 0.35));
    var cell = (window.width - L - pad) / SIZE; // cell size from canvas width
    return { L: L, pad: pad, cell: cell, bs: cell * SIZE };
  }

  function cellCenter(m, r, c) {
    return { x: m.L + c * m.cell + m.cell / 2, y: m.L + r * m.cell + m.cell / 2 };
  }

  function drawStoneX(cx, cy, cell, alpha) {
    var arm = cell * 0.30;
    var ctx = window.drawingContext;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.shadowColor = "rgba(30,27,75,0.45)";
    ctx.shadowBlur = cell * 0.12;
    ctx.shadowOffsetY = cell * 0.03;
    ctx.strokeStyle = "#4f46e5";
    ctx.lineWidth = cell * 0.13;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - arm, cy - arm); ctx.lineTo(cx + arm, cy + arm);
    ctx.moveTo(cx + arm, cy - arm); ctx.lineTo(cx - arm, cy + arm);
    ctx.stroke();
    ctx.restore();
  }

  function drawStoneO(cx, cy, cell, alpha) {
    var d = cell * 0.62;
    var ctx = window.drawingContext;
    window.noStroke();
    window.fill(220, 38, 38, Math.round(22 * (alpha == null ? 1 : alpha)));
    window.ellipse(cx, cy, d, d);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.shadowColor = "rgba(127,29,29,0.45)";
    ctx.shadowBlur = cell * 0.12;
    ctx.shadowOffsetY = cell * 0.03;
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = cell * 0.12;
    ctx.beginPath();
    ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  window.setup = function () {
    var w = Math.min(600, window.innerWidth - 32);
    w = Math.max(300, w);
    var cnv = window.createCanvas(w, w);
    cnv.parent("canvas-holder");
    window.textAlign(window.CENTER, window.CENTER);
    refreshClassifierUI(); // sync title, badge, key field + status with the combo
  };

  window.windowResized = function () {
    var w = Math.min(600, window.innerWidth - 32);
    w = Math.max(300, w);
    window.resizeCanvas(w, w);
  };

  window.draw = function () {
    var n = SIZE;
    var m = boardMetrics();
    var cell = m.cell, ox = m.L, oy = m.L, bs = m.bs;
    var ctx = window.drawingContext;

    // Canvas backdrop.
    var bg = ctx.createLinearGradient(0, 0, 0, window.height);
    bg.addColorStop(0, "#f8fafc");
    bg.addColorStop(1, "#e2e8f0");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, window.width, window.height);

    // Wooden board with soft shadow.
    ctx.save();
    ctx.shadowColor = "rgba(15,23,42,0.30)";
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 5;
    var wood = ctx.createLinearGradient(ox, oy, ox + bs, oy + bs);
    wood.addColorStop(0, "#f3cd8d");
    wood.addColorStop(0.55, "#e9b96f");
    wood.addColorStop(1, "#d9a056");
    ctx.fillStyle = wood;
    ctx.fillRect(ox, oy, bs, bs);
    ctx.restore();

    // Subtle alternating wash for readability.
    window.noStroke();
    for (var wr = 0; wr < n; wr++) {
      for (var wc = 0; wc < n; wc++) {
        if ((wr + wc) % 2) continue;
        window.fill(255, 255, 255, 26);
        window.rect(ox + wc * cell, oy + wr * cell, cell, cell);
      }
    }

    // R0–R14 / C0–C14 legends (same 0-based numbers as move keys).
    var winSet = {};
    for (var wi = 0; wi < winningLine.length; wi++) winSet[winningLine[wi].r + ":" + winningLine[wi].c] = true;
    window.noStroke();
    window.fill(71, 85, 105);
    window.textStyle(window.BOLD);
    window.textSize(Math.max(9, cell * 0.30));
    for (var lr = 0; lr < n; lr++) {
      window.text("R" + lr, ox / 2, oy + lr * cell + cell / 2 + 1);
    }
    for (var lc = 0; lc < n; lc++) {
      window.text("C" + lc, ox + lc * cell + cell / 2, oy / 2);
    }
    window.textStyle(window.NORMAL);

    // Last-move wash + winning-five pulse (under the grid).
    var pulse = 0.5 + 0.5 * Math.sin(window.frameCount * 0.08);
    window.noStroke();
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var bx = ox + c * cell, by = oy + r * cell;
        if (winSet[r + ":" + c]) {
          window.fill(34, 197, 94, Math.round(110 + 90 * pulse));
          window.rect(bx, by, cell, cell);
        } else if (lastMove && lastMove.r === r && lastMove.c === c) {
          window.fill(250, 204, 21, 120);
          window.rect(bx, by, cell, cell);
        }
      }
    }

    // Grid lines + star points.
    window.stroke(122, 72, 18, 160);
    window.strokeWeight(1);
    for (var g = 0; g <= n; g++) {
      window.line(ox + g * cell, oy, ox + g * cell, oy + bs);
      window.line(ox, oy + g * cell, ox + bs, oy + g * cell);
    }
    // Board frame.
    window.noFill();
    window.stroke(107, 63, 14);
    window.strokeWeight(3);
    window.rect(ox, oy, bs, bs);

    // Hover preview: ghost X on the empty hovered square.
    var hov = null;
    try {
      var cv = document.querySelector("#canvas-holder canvas");
      if (cv && cv.matches(":hover") && gameLive && !winner && !waiting) {
        var hc = Math.floor((window.mouseX - ox) / cell);
        var hr = Math.floor((window.mouseY - oy) / cell);
        if (inBounds(hr, hc) && !board[hr][hc]) hov = { r: hr, c: hc };
      }
    } catch (e) { hov = null; }
    if (hov) {
      window.noStroke();
      window.fill(79, 70, 229, 22);
      window.rect(ox + hov.c * cell, oy + hov.r * cell, cell, cell);
    }

    // Stones.
    for (var sr2 = 0; sr2 < n; sr2++) {
      for (var sc2 = 0; sc2 < n; sc2++) {
        var v = board[sr2][sc2];
        if (!v) continue;
        var ctr = cellCenter(m, sr2, sc2);
        if (v === "X") drawStoneX(ctr.x, ctr.y, cell);
        else drawStoneO(ctr.x, ctr.y, cell);
      }
    }
    if (hov) {
      var hctr = cellCenter(m, hov.r, hov.c);
      drawStoneX(hctr.x, hctr.y, cell, 0.35);
    }

    // Winning strike-through (last move keeps its yellow cell tint above).
    if (winningLine.length) {
      var a = cellCenter(m, winningLine[0].r, winningLine[0].c);
      var z = cellCenter(m, winningLine[winningLine.length - 1].r, winningLine[winningLine.length - 1].c);
      ctx.save();
      ctx.shadowColor = "rgba(22,101,52,0.8)";
      ctx.shadowBlur = 10;
      ctx.strokeStyle = "rgba(21,128,61," + (0.65 + 0.3 * pulse).toFixed(3) + ")";
      ctx.lineWidth = Math.max(3, cell * 0.14);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(z.x, z.y);
      ctx.stroke();
      ctx.restore();
    }

    // Dim overlay while waiting (board disabled).
    if (waiting) {
      window.noStroke();
      window.fill(255, 255, 255, 70);
      window.rect(ox, oy, bs, bs);
    }
  };

  function canvasCell() {
    var m = boardMetrics();
    return {
      c: Math.floor((window.mouseX - m.L) / m.cell),
      r: Math.floor((window.mouseY - m.L) / m.cell)
    };
  }

  window.mousePressed = function () {
    // Only handle clicks inside the canvas.
    if (window.mouseX < 0 || window.mouseY < 0 || window.mouseX >= window.width || window.mouseY >= window.height) return;
    var pos = canvasCell();
    if (!inBounds(pos.r, pos.c)) return;
    humanClick(pos.r, pos.c);
    return false; // prevent default scrolling on touch
  };

  // Touch support (p5 forwards touch to mouse by default, but be explicit).
  window.touchStarted = function () {
    if (window.mouseX < 0 || window.mouseY < 0 || window.mouseX >= window.width || window.mouseY >= window.height) return;
    var pos2 = canvasCell();
    if (!inBounds(pos2.r, pos2.c)) return;
    humanClick(pos2.r, pos2.c);
    return false;
  };
})();
</script>
</body>
</html>
