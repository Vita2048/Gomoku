<!DOCTYPE html>
<!--
  CORS NOTE (please read before local testing):
  1. This page calls https://api.typesafe.ai directly from the browser via fetch.
  2. If the API does not send CORS headers, the browser will block the response.
  3. Do NOT paste your key into any random public CORS proxy to work around this.
  4. A public proxy would see your Authorization header and could steal your key.
  5. For local testing only, run a tiny proxy YOU control (e.g. localhost) that
  6. forwards to api.typesafe.ai and adds Access-Control-Allow-Origin for you.
  7. Alternatively launch the browser with CORS disabled purely for local tests.
  8. Never commit, log, or share your key; keep it in memory + password field.
  9. This file never stores the key in localStorage, cookies, URLs, or logs.
  10. If fetch fails with a CORS TypeError, check DevTools console (redacted).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jef (TypeSafe AI) Tic-Tac-Toe demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg1: #eef2ff; --bg2: #faf5ff; --bg3: #ecfdf5;
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --card: #ffffff; --accent: #4f46e5; --accent2: #7c3aed;
    --ok: #16a34a; --bad: #dc2626; --warn: #b45309;
    --shadow: 0 12px 32px rgba(30, 27, 75, 0.12);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0; padding: 32px 20px 48px; color: var(--ink);
    background:
      radial-gradient(900px 320px at 15% -5%, #c7d2fe 0%, transparent 60%),
      radial-gradient(800px 300px at 90% 0%, #ddd6fe 0%, transparent 55%),
      linear-gradient(135deg, var(--bg1), var(--bg2) 48%, var(--bg3));
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 1120px; }
  .hero {
    background: linear-gradient(180deg, #ffffff, #f8faff);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px 16px; margin-bottom: 14px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), #06b6d4);
  }
  .brand { display: flex; gap: 14px; align-items: center; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; flex: 0 0 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.1rem;
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
  }
  h1 { margin: 0; font-size: 1.55rem; letter-spacing: -0.02em; }
  .subtitle { margin: 4px 0 10px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .badge {
    font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;
  }
  .badge.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .badge.green { background: #dcfce7; border-color: #bbf7d0; color: #166534; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 600; flex: 1 1 260px; }
  .field span.hint-inline { font-weight: 400; color: var(--muted); }
  .field input {
    padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px;
    font-size: 0.95rem; min-width: 0; width: 100%; background: #f8fafc;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18); background: #fff; }
  button {
    padding: 11px 18px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 700;
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    white-space: nowrap;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.05); }
  button:active { transform: translateY(0); }
  #status {
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--accent);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; min-height: 3.2em;
    font-size: 0.95rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    box-shadow: var(--shadow);
  }
  #status .err { color: var(--bad); font-weight: 600; }
  #status .warn { color: var(--warn); font-weight: 600; }
  .game-row { display: grid; grid-template-columns: minmax(300px, 640px) minmax(300px, 1fr); gap: 16px; align-items: start; justify-content: center; }
  @media (max-width: 980px) { .game-row { grid-template-columns: 1fr; } }
  .board-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; box-shadow: var(--shadow);
  }
  .board-card .board-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .board-card .legend-note { font-size: 0.76rem; color: var(--muted); margin: 0 0 10px; }
  .board-card .legend-note b { color: var(--ink); }
  #canvas-holder canvas { cursor: pointer; }
  #canvas-holder { display: flex; justify-content: center; }
  #inspector {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; font-size: 0.85rem; box-shadow: var(--shadow);
    position: sticky; top: 16px;
  }
  #inspector h2 { margin: 0 0 6px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15); }
  #inspector .meta { color: var(--muted); margin: 8px 0 4px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  #trafficMeta { text-transform: none; font-size: 0.85rem; color: var(--ink); font-weight: 600; }
  #inspector pre {
    background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 10px;
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-size: 0.72rem; line-height: 1.5; margin: 0; border: 1px solid #1e293b;
  }
  canvas { border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); touch-action: manipulation; }
  .hint { font-size: 0.85rem; color: var(--muted); margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true">5◦</div>
      <div>
        <h1>Jef (TypeSafe AI) Tic-Tac-Toe demo</h1>
        <p class="subtitle">Human player is X, Jev is O, 15&times;15, five in a row</p>
      </div>
    </div>
    <div class="badges">
      <span class="badge">X · You</span>
      <span class="badge">O · Jev</span>
      <span class="badge green">15&times;15 board</span>
      <span class="badge green">5 in a row wins</span>
      <span class="badge dark">jev-latest</span>
    </div>
  </header>

  <div class="controls">
    <label class="field" for="apiKey">TypeSafe API key 
      <input id="apiKey" type="password" autocomplete="off" placeholder="paste key here" />
    </label>
    <button id="newGameBtn" type="button">↺ New Game</button>
  </div>

  <div id="status" role="status" aria-live="polite">Loading…</div>
  <div class="game-row">
    <section class="board-card">
      <div id="canvas-holder"></div>
    </section>
    <aside id="inspector" aria-label="Jev API traffic">
      <h2><span class="live-dot" aria-hidden="true"></span>Jev traffic <span style="font-weight:400;color:#64748b">(key redacted)</span></h2>
      <div class="meta" id="trafficMeta">No requests yet.</div>
      <div class="meta">Request &rarr;</div>
      <pre id="reqPre">—</pre>
      <div class="meta">Response &larr;</div>
      <pre id="resPre">—</pre>
    </aside>
  </div>
  
</main>

<script>
(function () {
  "use strict";

  var SIZE = 15;
  var WIN = 5;
  //var API_URL = "https://api.typesafe.ai/v1/systemone";
  var API_URL = "http://127.0.0.1:8000/systemone";

  var board = [];
  var gameLive = true;
  var waiting = false;      // in-flight flag: board disabled while true
  var winner = null;        // 'X' | 'O' | 'Draw' | null
  var lastMove = null;      // {r, c, who}
  var winningLine = [];     // [{r,c}]
  var statusEl = document.getElementById("status");
  var apiKeyEl = document.getElementById("apiKey");
  var newGameBtn = document.getElementById("newGameBtn");
  var gameId = 0;           // bumped on New Game to ignore stale responses
  var lastJevCell = null;
  var lastJevRC = null; // {r, c} 0-based, for R1–R15 / C1–C15 display
  var lastConfidence = null;
  var trafficMetaEl = document.getElementById("trafficMeta");
  var reqPreEl = document.getElementById("reqPre");
  var resPreEl = document.getElementById("resPre");
  var exchangeCount = 0;
  var memJev = null;   // previous Jev move key, e.g. "r7c8"
  var memHuman = null; // previous human move key, e.g. "r8c8"
  var memPlan = null;  // previous strategic focus string

  function pretty(obj, cap) {
    var s;
    try {
      s = JSON.stringify(obj, null, 2);
    } catch (e) {
      s = String(obj);
    }
    s = redact(s);
    cap = cap || 12000;
    if (s.length > cap) return s.slice(0, cap) + "\n…[truncated " + (s.length - cap) + " chars]";
    return s;
  }

  function renderTraffic(meta, reqText, resText) {
    if (trafficMetaEl) trafficMetaEl.textContent = meta;
    // textContent (not innerHTML) + redact() => key can never leak into the panel.
    if (reqPreEl) reqPreEl.textContent = redact(reqText);
    if (resPreEl) resPreEl.textContent = redact(resText);
  }

  function emptyBoard() {
    var b = [];
    for (var r = 0; r < SIZE; r++) {
      b.push(new Array(SIZE).fill(""));
    }
    return b;
  }
  board = emptyBoard();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  // Redact Bearer tokens before anything touches the DOM / console.
  function redact(s) {
    return String(s == null ? "" : s).replace(/Bearer\s+[A-Za-z0-9._~+\/=\-]+/gi, "Bearer [REDACTED]");
  }

  // Human-readable square: R1–R15 top→bottom, C1–C15 left→right (1-based).
  function humanCell(r, c) {
    return "R" + (r + 1) + " C" + (c + 1);
  }

  function setStatus(html) {
    statusEl.innerHTML = html;
  }

  function renderStatus(opts) {
    opts = opts || {};
    var turn;
    if (winner === "X") turn = "Game over — X (you) win!";
    else if (winner === "O") turn = "Game over — O (Jev) wins.";
    else if (winner === "Draw") turn = "Game over — draw, board is full.";
    else if (waiting) turn = "Jev (O) is thinking… board disabled.";
    else turn = "Your turn (X) — click an empty square.";

    var html = esc(turn);
    if (lastJevCell) {
      var hm = lastJevRC ? " (" + humanCell(lastJevRC.r, lastJevRC.c) + ")" : "";
      var cf = lastConfidence != null ? " (confidence " + lastConfidence + ")" : "";
      html += "<br>" + esc("Last Jev move: " + lastJevCell + hm + cf);
    }
    if (opts.warn) html += '<br><span class="warn">' + esc(redact(opts.warn)) + "</span>";
    if (opts.error) html += '<br><span class="err">' + esc(redact(opts.error)) + "</span>";
    setStatus(html);
  }

  function newGame() {
    gameId++;               // invalidate any in-flight response
    board = emptyBoard();
    gameLive = true;
    waiting = false;
    winner = null;
    lastMove = null;
    winningLine = [];
    lastJevCell = null;
    lastJevRC = null;
    lastConfidence = null;
    memJev = null;
    memHuman = null;
    memPlan = null;
    // Do NOT clear the API key input (required).
    renderStatus({});
    renderTraffic("No requests yet.", "—", "—");
  }

  newGameBtn.addEventListener("click", newGame);

  function inBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function checkWin(b, r, c, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var d = 0; d < dirs.length; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var line = [{ r: r, c: c }];
      var i, nr, nc;
      for (i = 1; i < WIN; i++) {
        nr = r + dr * i; nc = c + dc * i;
        if (!inBounds(nr, nc) || b[nr][nc] !== who) break;
        line.push({ r: nr, c: nc });
      }
      for (i = 1; i < WIN; i++) {
        nr = r - dr * i; nc = c - dc * i;
        if (!inBounds(nr, nc) || b[nr][nc] !== who) break;
        line.unshift({ r: nr, c: nc });
      }
      if (line.length >= WIN) {
        // Return exactly the 5 containing the placed stone (trim longer runs).
        var idx = -1;
        for (i = 0; i < line.length; i++) {
          if (line[i].r === r && line[i].c === c) { idx = i; break; }
        }
        var start = Math.max(0, Math.min(idx - (WIN - 1), line.length - WIN));
        // Prefer a window containing idx.
        start = Math.max(0, Math.min(idx, line.length - WIN));
        if (idx - start >= WIN) start = idx - WIN + 1;
        return line.slice(start, start + WIN);
      }
    }
    return null;
  }

  function boardFull(b) {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!b[r][c]) return false;
    return true;
  }

  function boardToStrings(b) {
    var rows = [];
    for (var r = 0; r < SIZE; r++) {
      var s = "";
      for (var c = 0; c < SIZE; c++) s += b[r][c] === "" ? "." : b[r][c];
      rows.push(s);
    }
    return rows;
  }

  function legalCells(b) {
    var cells = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!b[r][c]) cells.push({ r: r, c: c, key: "r" + r + "c" + c });
    return cells;
  }

  function parseKey(key) {
    var m = /^r(\d+)c(\d+)$/.exec(String(key || "").trim());
    if (!m) return null;
    var r = parseInt(m[1], 10), c = parseInt(m[2], 10);
    if (!Number.isInteger(r) || !Number.isInteger(c)) return null;
    if (r < 0 || r > 14 || c < 0 || c > 14) return null;
    return { r: r, c: c };
  }

  function getPath(obj, keys) {
    var cur = obj;
    for (var i = 0; i < keys.length; i++) {
      if (cur == null || typeof cur !== "object") return undefined;
      cur = cur[keys[i]];
    }
    return cur;
  }

  // Robust choice/probabilities/confidence extraction: the documented path is
  // answers.next_move.choice, but probe nearby shapes without ever logging keys.
  function extractChoice(data) {
    var paths = [
      ["answers", "next_move", "choice"],
      ["answers", "nextMove", "choice"],
      ["answer", "next_move", "choice"],
      ["data", "answers", "next_move", "choice"],
      ["result", "answers", "next_move", "choice"],
      ["next_move", "choice"],
      ["nextMove", "choice"],
      ["choice"]
    ];
    for (var i = 0; i < paths.length; i++) {
      var v = getPath(data, paths[i]);
      if (typeof v === "string" && v) return v.trim();
    }
    // Alternate field names some APIs use.
    var altPaths = [
      ["answers", "next_move", "selected"],
      ["answers", "next_move", "value"],
      ["answers", "next_move", "option"],
      ["answers", "next_move", "key"]
    ];
    for (var j = 0; j < altPaths.length; j++) {
      var w = getPath(data, altPaths[j]);
      if (typeof w === "string" && w) return w.trim();
    }
    return null;
  }

  function extractProbabilities(data) {
    var paths = [
      ["answers", "next_move", "probabilities"],
      ["answers", "nextMove", "probabilities"],
      ["next_move", "probabilities"],
      ["answers", "next_move", "probs"],
      ["probabilities"]
    ];
    for (var i = 0; i < paths.length; i++) {
      var v = getPath(data, paths[i]);
      if (v && typeof v === "object") return v;
    }
    return null;
  }

  function extractConfidence(data) {
    var paths = [
      ["answers", "next_move", "confidence"],
      ["answers", "nextMove", "confidence"],
      ["next_move", "confidence"],
      ["confidence"]
    ];
    for (var i = 0; i < paths.length; i++) {
      var v = getPath(data, paths[i]);
      if (typeof v === "number" || typeof v === "string") return v;
    }
    return null;
  }

  // ---- Local tactics: shrink + label options so Jev chooses strongly ----
  // Hints-first design: the client NEVER plays the win/block itself before the
  // API call. It only computes hints (winning cells, scores, sorted order) and
  // puts them into instructions + criteria labels so Jev makes the smart move
  // himself. Local win>block>best is kept ONLY as a safety net if Jev's reply
  // is missing/malformed/occupied.
  var MAX_OPTIONS = 40; // shrink from ~225 empties to top-N tactical candidates
  var BASE_INSTRUCTIONS = "You are O. One stone only.\n\nDecision protocol:\n1. Play a winning move if available.\n2. Otherwise block any immediate X win.\n3. Otherwise create or block an open four.\n4. Prefer forks (two simultaneous threats).\n5. Stay near existing stones.\n6. Ignore symmetry unless it prevents a threat.";

  function dirName(dr, dc) {
    if (dr === 0 && dc === 1) return "horizontal";
    if (dr === 1 && dc === 0) return "vertical";
    if (dr === 1 && dc === 1) return "diagonal ↘";
    return "diagonal ↙";
  }

  // Count stones of `who` through (r,c) along (dr,dc), assuming (r,c) becomes `who`.
  function lineInfo(b, r, c, dr, dc, who) {
    var pos = 0, nr = r + dr, nc = c + dc;
    while (inBounds(nr, nc) && b[nr][nc] === who) { pos++; nr += dr; nc += dc; }
    var posOpen = inBounds(nr, nc) && !b[nr][nc];
    var neg = 0;
    nr = r - dr; nc = c - dc;
    while (inBounds(nr, nc) && b[nr][nc] === who) { neg++; nr -= dr; nc -= dc; }
    var negOpen = inBounds(nr, nc) && !b[nr][nc];
    return { total: 1 + pos + neg, open: (posOpen ? 1 : 0) + (negOpen ? 1 : 0) };
  }

  // Gap-pattern vision: sliding 5-window over an 11-cell line with (r,c)
  // simulated as `who`. Catches broken fours (e.g. SS_SS) and open threes
  // that contiguous counting undervalues.
  function windowBest(b, r, c, dr, dc, who) {
    var ch = [];
    for (var k = -5; k <= 5; k++) {
      if (k === 0) { ch.push("S"); continue; }
      var nr = r + dr * k, nc = c + dc * k;
      if (!inBounds(nr, nc)) { ch.push("#"); continue; }
      var v = b[nr][nc];
      ch.push(v === who ? "S" : (!v ? "." : "#"));
    }
    var out = { five: false, four: false, openFour: false, openThree: false, three: false };
    for (var s = 1; s <= 5; s++) {
      var cntS = 0, cntD = 0, bad = false;
      for (var j = 0; j < 5; j++) {
        if (ch[s + j] === "S") cntS++;
        else if (ch[s + j] === ".") cntD++;
        else { bad = true; break; }
      }
      if (bad) continue;
      if (cntS === 5) out.five = true;
      else if (cntS === 4 && cntD === 1) {
        out.four = true;
        if (ch[s - 1] === "." && ch[s + 5] === ".") out.openFour = true;
      } else if (cntS === 3 && cntD === 2) {
        out.three = true;
        if (ch[s - 1] === "." && ch[s + 5] === ".") out.openThree = true;
      }
    }
    return out;
  }

  function nearestDist(b, r, c) {
    var best = 99;
    for (var rr = 0; rr < SIZE; rr++) {
      for (var cc = 0; cc < SIZE; cc++) {
        if (b[rr][cc]) {
          var d = Math.max(Math.abs(rr - r), Math.abs(cc - c));
          if (d < best) best = d;
          if (best <= 1) return best;
        }
      }
    }
    return best;
  }

  var DIRS4 = [[0, 1], [1, 0], [1, 1], [1, -1]];

  function evalCell(b, r, c) {
    var oLines = [], xLines = [], i;
    for (i = 0; i < 4; i++) {
      oLines.push(lineInfo(b, r, c, DIRS4[i][0], DIRS4[i][1], "O"));
      xLines.push(lineInfo(b, r, c, DIRS4[i][0], DIRS4[i][1], "X"));
    }
    function best(lines) {
      var bi = 0;
      for (var k = 1; k < lines.length; k++) {
        if (lines[k].total > lines[bi].total ||
            (lines[k].total === lines[bi].total && lines[k].open > lines[bi].open)) bi = k;
      }
      return { idx: bi, total: lines[bi].total, open: lines[bi].open };
    }
    var oB = best(oLines), xB = best(xLines);
    var oWinIdx = -1, xWinIdx = -1, k;
    for (k = 0; k < 4; k++) {
      if (oLines[k].total >= WIN && oWinIdx < 0) oWinIdx = k;
      if (xLines[k].total >= WIN && xWinIdx < 0) xWinIdx = k;
    }
    var oThreats = 0, xThreats = 0;
    for (k = 0; k < 4; k++) {
      if (oLines[k].total >= 3 && oLines[k].open > 0) oThreats++;
      if (xLines[k].total >= 3 && xLines[k].open > 0) xThreats++;
    }
    // Gap-pattern vision per direction (broken fours, open threes with a gap).
    var oGapFour = false, xGapFour = false, oOpenThree = false, xOpenThree = false;
    var oGapDir = null, xGapDir = null;
    for (k = 0; k < 4; k++) {
      var ow = windowBest(b, r, c, DIRS4[k][0], DIRS4[k][1], "O");
      if (ow.four && oLines[k].total < 4 && !oGapFour) { oGapFour = true; oGapDir = dirName(DIRS4[k][0], DIRS4[k][1]); }
      if (ow.openThree) oOpenThree = true;
      var xw = windowBest(b, r, c, DIRS4[k][0], DIRS4[k][1], "X");
      if (xw.four && xLines[k].total < 4 && !xGapFour) { xGapFour = true; xGapDir = dirName(DIRS4[k][0], DIRS4[k][1]); }
      if (xw.openThree) xOpenThree = true;
    }
    return {
      oMax: oB.total, oOpen: oB.open, oDir: dirName(DIRS4[oB.idx][0], DIRS4[oB.idx][1]),
      xMax: xB.total, xOpen: xB.open, xDir: dirName(DIRS4[xB.idx][0], DIRS4[xB.idx][1]),
      oWin: oWinIdx >= 0, xWin: xWinIdx >= 0,
      oWinDir: oWinIdx >= 0 ? dirName(DIRS4[oWinIdx][0], DIRS4[oWinIdx][1]) : null,
      xWinDir: xWinIdx >= 0 ? dirName(DIRS4[xWinIdx][0], DIRS4[xWinIdx][1]) : null,
      oThreats: oThreats, xThreats: xThreats,
      doubleO: oThreats >= 2, doubleX: xThreats >= 2,
      oGapFour: oGapFour, xGapFour: xGapFour, oGapDir: oGapDir, xGapDir: xGapDir,
      oOpenThree: oOpenThree, xOpenThree: xOpenThree,
      allowsXWin: null, // filled by 2-ply safety scan in buildLabeledCriteria
      allowsXForce: null, // filled by 3-ply forced-win scan in buildLabeledCriteria
      dist: nearestDist(b, r, c)
    };
  }

  function countWinningCellsCapped(b, who, cap) {
    var n = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        for (var k = 0; k < 4; k++) {
          if (lineInfo(b, r, c, DIRS4[k][0], DIRS4[k][1], who).total >= WIN) { n++; break; }
        }
        if (n >= cap) return n;
      }
    }
    return n;
  }

  function findWinningCells(b, who) {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        var ok = false;
        for (var k = 0; k < 4; k++) {
          if (lineInfo(b, r, c, DIRS4[k][0], DIRS4[k][1], who).total >= WIN) { ok = true; break; }
        }
        if (ok) out.push({ r: r, c: c, key: "r" + r + "c" + c });
      }
    }
    return out;
  }

  function scoreCell(ev) {
    if (ev.oWin) return 100000;
    if (ev.xWin) return 90000;
    var s = 0;
    if (ev.oMax >= 4) s += 8000 + ev.oOpen * 500;
    else if (ev.oGapFour) s += 7500; // broken four, e.g. SS_SS — one move from five
    else if (ev.oMax === 3) s += ev.oOpen === 2 ? 4000 : (ev.oOpen === 1 ? 2000 : 500);
    else if (ev.oMax === 2) s += ev.oOpen > 0 ? 400 : 50;
    if (ev.xMax >= 4) s += 7000 + ev.xOpen * 400;
    else if (ev.xGapFour) s += 6500; // must cover the gap before X does
    else if (ev.xMax === 3) s += ev.xOpen === 2 ? 3500 : (ev.xOpen === 1 ? 1500 : 300);
    else if (ev.xMax === 2) s += ev.xOpen > 0 ? 300 : 30;
    if (ev.oOpenThree) s += 1200;
    if (ev.xOpenThree) s += 1000;
    if (ev.doubleO) s += 2500;
    if (ev.doubleX) s += 2000;
    if (ev.allowsXWin && ev.allowsXWin.length) s -= 20000; // 2-ply safety: hangs an immediate loss
    if (ev.allowsXForce && ev.allowsXForce.length) s -= 15000; // 3-ply safety: allows a forced win in 2
    if (ev.dist <= 1) s += 200;
    else if (ev.dist === 2) s += 50;
    else s -= 5000; // rule 5: never play far
    return s;
  }

  // Tactical tiers for presentation. Numeric scores stay internal (sort only):
  // S = forced win/block, A = critical four-level/fork, B = three-level, C = positional.
  function tierOf(ev) {
    if (ev.oWin || ev.xWin) return "S";
    if (ev.oMax >= 4 || ev.oGapFour || ev.xMax >= 4 || ev.xGapFour || ev.doubleO || ev.doubleX) return "A";
    if (ev.oMax === 3 || ev.xMax === 3 || ev.oOpenThree || ev.xOpenThree) return "B";
    return "C";
  }

  // One-line tactical description. Avoid-moves are relabeled by the caller.
  function labelCell(r, c, ev) {
    if (ev.oWin && ev.xWin) return "WINS O now and BLOCKS X win";
    if (ev.oWin) return "WINS O now";
    if (ev.xWin) return "BLOCKS X win";
    // Weight each side the way scores do, then label the stronger one.
    var oW = ev.oMax >= 4 ? 4 : ev.oGapFour ? 3.6 : (ev.oMax === 3 && ev.oOpen === 2) || ev.oOpenThree ? 3 : ev.oMax === 3 ? 2 : ev.oMax === 2 ? 1 : 0;
    var xW = ev.xMax >= 4 ? 3.8 : ev.xGapFour ? 3.4 : (ev.xMax === 3 && ev.xOpen === 2) || ev.xOpenThree ? 2.8 : ev.xMax === 3 ? 1.8 : ev.xMax === 2 ? 0.8 : 0;
    if (ev.doubleO && oW < 3) oW = 3.2; // a fork outranks a lone three
    if (ev.doubleX && xW < 3) xW = 3.0;
    var s;
    if (oW >= xW && oW > 0) {
      if (ev.oMax >= 4) s = "Creates open four";
      else if (ev.oGapFour) s = "Creates broken four";
      else if ((ev.oMax === 3 && ev.oOpen === 2) || ev.oOpenThree) s = "Creates open three";
      else if (ev.oMax === 3) s = "Extends O three";
      else s = "Extends O two";
      if (ev.doubleO) s += " + fork";
    } else if (xW > 0) {
      if (ev.xMax >= 4) s = "Blocks open four";
      else if (ev.xGapFour) s = "Blocks broken four";
      else if ((ev.xMax === 3 && ev.xOpen === 2) || ev.xOpenThree) s = "Blocks open three";
      else if (ev.xMax === 3) s = "Blocks X three";
      else s = "Covers X two";
      if (ev.doubleX) s += " + fork";
    } else {
      s = "Positional move";
    }
    return s;
  }

  // ---- Presentation layer: summary, PV, tiers (analysis above is untouched) ----

  // Single-move attack strength for `who` placed at (r,c), reusing lineInfo
  // and windowBest. Scale: 5000+ five, 4000+ four, 3500+ broken four,
  // 3000+ open three, 2000+ three, 1000+ two.
  function attackStrength(b, r, c, who) {
    var best = 0;
    for (var k = 0; k < 4; k++) {
      var li = lineInfo(b, r, c, DIRS4[k][0], DIRS4[k][1], who);
      var wb = windowBest(b, r, c, DIRS4[k][0], DIRS4[k][1], who);
      var s = li.total * 1000 + li.open * 100;
      if (wb.four && li.total < 4) s += 500;
      if (wb.openThree) s += 200;
      if (s > best) best = s;
    }
    return best;
  }

  function levelName(s) {
    if (s >= 5000) return "five";
    if (s >= 4000) return "four";
    if (s >= 3500) return "broken four";
    if (s >= 3000) return "open three";
    if (s >= 2000) return "three";
    if (s >= 1000) return "two";
    return "quiet";
  }

  // Strongest attacking reply for `who` on board b (near-stone empties only).
  function bestAttackCell(b, who) {
    var best = null;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        if (nearestDist(b, r, c) > 2) continue;
        var s = attackStrength(b, r, c, who);
        if (!best || s > best.s) best = { r: r, c: c, key: "r" + r + "c" + c, s: s };
      }
    }
    return best;
  }

  // Principal variation for one O candidate: O move, strongest X reply,
  // strongest O continuation — all from existing local evaluation, no API.
  function pvFor(b, cand) {
    if (cand.ev.oWin) return "PV: O " + cand.key + " wins immediately.";
    var s1 = [];
    for (var i = 0; i < SIZE; i++) s1.push(b[i].slice());
    s1[cand.r][cand.c] = "O";
    var xw = findWinningCells(s1, "X");
    if (xw.length) return "PV: O " + cand.key + ", X " + xw[0].key + " wins immediately — O's move fails.";
    var xr = bestAttackCell(s1, "X");
    if (!xr) return "PV: O " + cand.key + " (board full).";
    s1[xr.r][xr.c] = "X";
    var ow = findWinningCells(s1, "O");
    if (ow.length) return "PV: O " + cand.key + ", X " + xr.key + ", O " + ow[0].key + " wins.";
    var oc = bestAttackCell(s1, "O");
    var oS = oc ? oc.s : 0;
    var res = oS > xr.s ? "O keeps initiative" : oS < xr.s ? "X keeps initiative" : "balanced";
    return "PV: O " + cand.key + ", X " + xr.key + ", O " + (oc ? oc.key : "—") +
      " — O " + levelName(oS) + " vs X " + levelName(xr.s) + ", " + res + ".";
  }

  // 1-based critical-area box, e.g. "R7–R9, C6–C9".
  function bboxArea(cells) {
    if (!cells.length) return null;
    var r0 = 99, r1 = -1, c0 = 99, c1 = -1, i;
    for (i = 0; i < cells.length; i++) {
      if (cells[i].r < r0) r0 = cells[i].r;
      if (cells[i].r > r1) r1 = cells[i].r;
      if (cells[i].c < c0) c0 = cells[i].c;
      if (cells[i].c > c1) c1 = cells[i].c;
    }
    var rs = r0 === r1 ? "R" + (r0 + 1) : "R" + (r0 + 1) + "–R" + (r1 + 1);
    var cs = c0 === c1 ? "C" + (c0 + 1) : "C" + (c0 + 1) + "–C" + (c1 + 1);
    return rs + ", " + cs;
  }

  function stonesOf(b) {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) out.push({ r: r, c: c });
      }
    }
    return out;
  }

  // Compact position summary from already-evaluated near-cells.
  function buildSummary(b, cands, oWins, xWins, xBuilds) {
    var oFour = 0, oBroken = 0, oThree = 0, xFour = 0, xBroken = 0, xThree = 0, oForks = 0, xForks = 0;
    for (var i = 0; i < cands.length; i++) {
      var ev = cands[i].ev;
      if (ev.oMax >= 4 && ev.oOpen > 0) oFour++;
      if (ev.oGapFour) oBroken++;
      if (ev.oOpenThree || (ev.oMax === 3 && ev.oOpen === 2)) oThree++;
      if (ev.xMax >= 4 && ev.xOpen > 0) xFour++;
      if (ev.xGapFour) xBroken++;
      if (ev.xOpenThree || (ev.xMax === 3 && ev.xOpen === 2)) xThree++;
      if (ev.doubleO) oForks++;
      if (ev.doubleX) xForks++;
    }
    var focus;
    if (oWins.length) focus = "attack — take the win now";
    else if (xWins.length) focus = "defend — block X's win first";
    else if (xBuilds.length) focus = "defend first, then build a fork";
    else if (oFour || oBroken || oForks) focus = "attack — extend the threat or build a fork";
    else if (oThree) focus = "attack — grow the open three";
    else focus = "develop near existing stones";
    var hot = oWins.concat(xWins).concat(xBuilds.slice(0, 6));
    var L = ["Position summary:"];
    L.push(xWins.length ? "- X has " + xWins.length + " immediate winning threat" + (xWins.length > 1 ? "s" : "") + "." : "- No immediate X wins.");
    L.push(oWins.length ? "- O has " + oWins.length + " immediate winning move" + (oWins.length > 1 ? "s" : "") + "." : "- No immediate O wins.");
    var oa = [];
    if (oFour) oa.push(oFour + " open-four");
    if (oBroken) oa.push(oBroken + " broken-four");
    if (oThree) oa.push(oThree + " open-three");
    L.push(oa.length ? "- O attacks: " + oa.join(", ") + " squares." : "- O attacks: none.");
    var xa = [];
    if (xFour) xa.push(xFour + " open-four");
    if (xBroken) xa.push(xBroken + " broken-four");
    if (xThree) xa.push(xThree + " open-three");
    L.push(xa.length ? "- X attacks: " + xa.join(", ") + " squares." : "- X attacks: none.");
    if (oForks || xForks) L.push("- Forks: O " + oForks + " / X " + xForks + " squares.");
    var area = bboxArea(hot.length ? hot : stonesOf(b));
    if (area) L.push("- Critical area: " + area + ".");
    L.push("- Strategic focus: " + focus + ".");
    return { text: L.join("\n"), focus: focus };
  }

  // Shrink: keep only near-stone tactical candidates, labeled with WHY.
  function buildLabeledCriteria(b) {
    var xWins = findWinningCells(b, "X");
    var oWins = findWinningCells(b, "O");
    var cands = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (b[r][c]) continue;
        var ev = evalCell(b, r, c);
        if (ev.dist > 2 && !ev.oWin && !ev.xWin) continue; // shrink far cells (rule 5)
        cands.push({ r: r, c: c, key: "r" + r + "c" + c, ev: ev, score: scoreCell(ev) });
      }
    }
    // Early game (few stones): cands is already small. Late game: sort + cap.
    cands.sort(function (a, b2) { return b2.score - a.score; });
    var picked = cands.slice(0, MAX_OPTIONS);
    // Guarantee key cells survive the cap, keeping their natural rank —
    // wins score as wins (100000/90000), builds keep their candidate score.
    function ensure(list) {
      for (var i = 0; i < list.length; i++) {
        var found = false;
        for (var j = 0; j < picked.length; j++) {
          if (picked[j].key === list[i].key) { found = true; break; }
        }
        if (!found && picked.length < 255) {
          var w = list[i];
          if (w.ev) { picked.push(w); continue; }
          var lev = evalCell(b, w.r, w.c);
          picked.push({ r: w.r, c: w.c, key: w.key, ev: lev, score: scoreCell(lev) });
        }
      }
    }
    ensure(oWins);
    ensure(xWins);
    // X build-up cells: squares where X is one move from a forcing attack
    // (four / broken-four / open three). Used for coverage + hint below.
    function xBuildStrength(ev) {
      var s = 0;
      if (ev.xMax >= 4) s += 7000;
      else if (ev.xGapFour) s += 6500;
      else if (ev.xMax === 3) s += ev.xOpen === 2 ? 3500 : 1500;
      if (ev.xOpenThree) s += 1000;
      return s;
    }
    var xBuilds = cands
      .filter(function (cd) { return xBuildStrength(cd.ev) >= 1500; })
      .sort(function (a, b2) { return xBuildStrength(b2.ev) - xBuildStrength(a.ev); })
      .slice(0, 6);
    ensure(xBuilds);
    // 2-ply safety: if X already has an immediate win, any O move that does
    // not block it hangs the loss — demote hard with an explicit label.
    // (Placing O can only remove X wins, never create them, so when xWins is
    // empty there is nothing to check.) A winning O move itself is safe.
    // Cost is ~picked × empties line scans — trivial at 15×15.
    if (xWins.length) {
      for (var t = 0; t < picked.length; t++) {
        var pc = picked[t];
        if (!pc.ev.oWin && !pc.ev.xWin) {
          var sim = [];
          for (var sr = 0; sr < SIZE; sr++) sim.push(b[sr].slice());
          sim[pc.r][pc.c] = "O";
          var reply = findWinningCells(sim, "X");
          if (reply.length) {
            pc.ev.allowsXWin = reply.slice(0, 3).map(function (w) { return w.key; });
            pc.score = scoreCell(pc.ev);
          }
        }
      }
    }
    // 3-ply safety (the screenshot blunder): no immediate X five, but X may
    // be one reply away from a FORCED win — a move creating 2+ immediate
    // winning cells (open four / double threat), which O cannot stop next.
    // Simulate each O candidate, then each plausible X reply, counting X's
    // winning cells with early exit at 2. Gated to hot positions only.
    if (!xWins.length && xBuilds.length) {
      var replies = cands.slice()
        .sort(function (a, b2) { return xBuildStrength(b2.ev) - xBuildStrength(a.ev); })
        .slice(0, 40);
      for (var u = 0; u < picked.length; u++) {
        var pu = picked[u];
        if (pu.ev.oWin || pu.ev.xWin || pu.ev.allowsXWin) continue;
        var s1 = [];
        for (var a1 = 0; a1 < SIZE; a1++) s1.push(b[a1].slice());
        s1[pu.r][pu.c] = "O";
        var forceVia = null;
        for (var v = 0; v < replies.length; v++) {
          if (s1[replies[v].r][replies[v].c]) continue;
          s1[replies[v].r][replies[v].c] = "X";
          var nw = countWinningCellsCapped(s1, "X", 2);
          s1[replies[v].r][replies[v].c] = "";
          if (nw >= 2) { forceVia = replies[v].key; break; }
        }
        if (forceVia) {
          pu.ev.allowsXForce = [forceVia];
          pu.score = scoreCell(pu.ev);
        }
      }
    }
    // Re-sort after ensure + safety scan so the sent order is always strongest-first.
    picked.sort(function (a, b2) { return b2.score - a.score; });
    // Absolute fallback: board full of far cells (should not happen) — take center.
    if (!picked.length) {
      var free = legalCells(b).slice(0, MAX_OPTIONS);
      for (var f = 0; f < free.length; f++) {
        picked.push({ r: free[f].r, c: free[f].c, key: free[f].key, ev: evalCell(b, free[f].r, free[f].c), score: 0 });
      }
    }
    // Position summary from all evaluated near-cells (pre-cap, full picture).
    var summary = buildSummary(b, cands, oWins, xWins, xBuilds);
    // Principal variation for the top 6, existing local evaluation only.
    var pvMap = {};
    var pvN = Math.min(6, picked.length);
    for (var q = 0; q < pvN; q++) pvMap[picked[q].key] = pvFor(b, picked[q]);
    // Tiered one-line labels. Numeric scores stay internal (sort order only).
    var criteria = {};
    for (var p = 0; p < picked.length; p++) {
      var cell = picked[p], evp = cell.ev;
      var avoid = null;
      if (evp.allowsXWin && evp.allowsXWin.length) avoid = "Avoid (allows X win next)";
      else if (evp.allowsXForce && evp.allowsXForce.length) avoid = "Avoid (allows X forced win)";
      var tier = avoid ? "C" : tierOf(evp);
      var val = "Tier " + tier + " #" + (p + 1) + " — " + (avoid ? avoid : labelCell(cell.r, cell.c, evp));
      if (pvMap[cell.key]) val += "\n" + pvMap[cell.key];
      criteria[cell.key] = val;
    }
    return { criteria: criteria, xWins: xWins, oWins: oWins, xBuilds: xBuilds, picked: picked, summary: summary };
  }

  // Dynamic per-move instructions: summary + memory + protocol + hints.
  // Jev enforces win/block HIMSELF via prompt, never via client override.
  function buildInstructions(analyzed) {
    var s = BASE_INSTRUCTIONS +
      "\n\nOptions are ranked Tier S (forced win/block) > A (critical) > B (strong) > C (positional), #1 strongest; follow the order unless you see a forced win." +
      " Never play a move labeled Avoid — it loses now or hands X a forced win.";
    s += "\n\n" + analyzed.summary.text;
    s += "\n\nPrevious turn:\n- Jev: " + (memJev || "none yet") +
      "\n- Human: " + (memHuman || "none yet") +
      "\n- Previous plan: " + (memPlan || "none yet");
    if (analyzed.oWins.length) {
      var ow = analyzed.oWins.map(function (w) { return w.key; }).join(", ");
      s += "\n\nHINT — YOU CAN WIN NOW: O completes five-in-a-row at " + ow +
        ". You must choose one of these Tier S options this move. Do not play anywhere else.";
    } else if (analyzed.xWins.length) {
      var xw = analyzed.xWins.map(function (w) { return w.key; }).join(", ");
      s += "\n\nHINT — YOU MUST BLOCK NOW: X will complete five next move at " + xw +
        ". You must choose a Tier S BLOCKS option covering it. Any other move loses immediately." +
        " Tier C options do NOT save you — ignore symmetry-copying.";
    } else if (analyzed.xBuilds && analyzed.xBuilds.length) {
      var xb = analyzed.xBuilds.slice(0, 3).map(function (w) { return w.key; }).join(", ");
      s += "\n\nHINT — X is building toward a forcing attack around " + xb +
        ". Prefer Tier A options contesting those squares over quiet extensions of your own line." +
        " Symmetry-copying X elsewhere does NOT stop this — contest the build-up directly.";
    } else {
      s += "\n\nHINT — no immediate five for either side. Follow the protocol: best Tier A/B attack or fork, stay near stones.";
    }
    return s;
  }

  function bestLegalFromProbabilities(probs, b) {
    if (!probs || typeof probs !== "object") return null;
    var best = null, bestP = -Infinity;
    function consider(key, p) {
      var pos = parseKey(key);
      if (!pos) return;
      if (b[pos.r][pos.c]) return; // occupied
      var num = Number(p);
      if (!isFinite(num)) return;
      if (num > bestP) { bestP = num; best = pos; }
    }
    if (Array.isArray(probs)) {
      for (var i = 0; i < probs.length; i++) {
        var e = probs[i];
        if (e == null) continue;
        if (typeof e === "string") continue;
        if (typeof e === "object") {
          var k = e.key || e.option || e.choice || e.name || e.label;
          var p = e.probability != null ? e.probability : (e.prob != null ? e.prob : e.p);
          if (k) consider(k, p);
        }
      }
    } else {
      Object.keys(probs).forEach(function (k) { consider(k, probs[k]); });
    }
    return best;
  }

  function requestJevMove(myGameId) {
    var key = apiKeyEl.value; // memory + input only; never stored/logged
    if (!key || !key.trim()) {
      waiting = false;
      renderStatus({ error: "Missing API key: paste your TypeSafe API key first. No request was sent." });
      return;
    }
    var model = "jev-latest"; // fixed default; no UI override

    var analyzed = buildLabeledCriteria(board);
    var criteria = analyzed.criteria;

    var body = {
      model: model,
      state: {
        game: "15x15 five-in-a-row",
        win_length: 5,
        to_move: "O",
        legend: ". empty, X human, O Jef",
        board: boardToStrings(board)
      },
      questions: {
        next_move: {
          type: "choice",
          instructions: buildInstructions(analyzed),
          criteria: criteria
        }
      }
    };

    waiting = true;
    renderStatus({});

    exchangeCount++;
    var myExchange = exchangeCount;
    var emptyTotal = legalCells(board).length;
    var reqText = "POST " + API_URL + "\nAuthorization: Bearer [REDACTED]\nContent-Type: application/json\n\n" + pretty(body);
    renderTraffic(
      "Move #" + myExchange + ": sent " + Object.keys(criteria).length + " labeled options (" + emptyTotal + " empties) — waiting for Jev…",
      reqText,
      "… waiting for response …"
    );

    // NOTE: key goes only to API_URL (your localhost proxy, which forwards to
    // https://api.typesafe.ai). Never send it anywhere else.
    fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (t) {
          throw new Error("API error " + resp.status + " " + resp.statusText + (t ? ": " + t.slice(0, 300) : ""));
        });
      }
      return resp.json();
    }).then(function (data) {
      if (myGameId !== gameId) return; // New Game pressed while in flight
      var warn = null;
      var choice = extractChoice(data);
      var probs = extractProbabilities(data);
      var conf = extractConfidence(data);
      if (conf != null) lastConfidence = String(conf);

      var pos = choice ? parseKey(choice) : null;
      if (pos && board[pos.r][pos.c]) {
        warn = "Jev chose occupied cell " + choice + "; fell back to a legal cell.";
        pos = null;
      } else if (choice && !pos) {
        warn = 'Jev returned malformed choice "' + String(choice).slice(0, 40) + '"; fell back to a legal cell.';
      } else if (!choice) {
        warn = "Jev response had no usable choice; fell back to a legal cell.";
      }
      // Hints-first: if Jev's own legal choice ignores the hint, keep his move
      // but surface it — this tells us whether the hints are working.
      if (pos && !board[pos.r][pos.c]) {
        var ckey = "r" + pos.r + "c" + pos.c;
        var inList = function (list) {
          for (var li = 0; li < list.length; li++) if (list[li].key === ckey) return true;
          return false;
        };
        if (analyzed.oWins.length && !inList(analyzed.oWins)) {
          warn = (warn ? warn + " " : "") + "Note: Jev ignored WIN hint (" + analyzed.oWins.map(function (w) { return w.key; }).join(", ") + ").";
        } else if (!analyzed.oWins.length && analyzed.xWins.length && !inList(analyzed.xWins)) {
          warn = (warn ? warn + " " : "") + "Note: Jev ignored MUST-BLOCK hint (" + analyzed.xWins.map(function (w) { return w.key; }).join(", ") + ").";
        }
      }

      if (!pos && probs) {
        var bp = bestLegalFromProbabilities(probs, board);
        if (bp) {
          pos = bp;
          warn = (warn ? warn + " " : "") + "Used highest-probability legal cell.";
        }
      }
      if (!pos) {
        // Local tactical fallback (no API trust needed): win > block > best labeled.
        if (analyzed.oWins.length && !board[analyzed.oWins[0].r][analyzed.oWins[0].c]) {
          pos = { r: analyzed.oWins[0].r, c: analyzed.oWins[0].c };
          warn = (warn ? warn + " " : "") + "Fallback: played local winning move " + analyzed.oWins[0].key + ".";
        } else if (analyzed.xWins.length && !board[analyzed.xWins[0].r][analyzed.xWins[0].c]) {
          pos = { r: analyzed.xWins[0].r, c: analyzed.xWins[0].c };
          warn = (warn ? warn + " " : "") + "Fallback: blocked X's win at " + analyzed.xWins[0].key + ".";
        } else if (analyzed.picked.length) {
          pos = { r: analyzed.picked[0].r, c: analyzed.picked[0].c };
          warn = (warn ? warn + " " : "") + "Fallback: played top tactical candidate " + analyzed.picked[0].key + ".";
        }
      }
      if (!pos) {
        var free = legalCells(board);
        if (!free.length) {
          waiting = false; winner = "Draw"; renderStatus({ warn: warn });
          renderTraffic("Move #" + myExchange + ": board full, draw.", reqText, "choice=" + String(choice) + "\n\n" + pretty(data));
          return;
        }
        pos = free[Math.floor(Math.random() * free.length)];
        if (!warn) warn = "No probabilities available; played a random legal cell.";
      }

      board[pos.r][pos.c] = "O";
      lastMove = { r: pos.r, c: pos.c, who: "O" };
      lastJevCell = "r" + pos.r + "c" + pos.c;
      lastJevRC = { r: pos.r, c: pos.c };
      memJev = lastJevCell;
      memPlan = analyzed.summary.focus;
      var line = checkWin(board, pos.r, pos.c, "O");
      waiting = false;
      if (line) { winner = "O"; winningLine = line; gameLive = false; }
      else if (boardFull(board)) { winner = "Draw"; gameLive = false; }
      renderStatus({ warn: warn });
      renderTraffic(
        "Move #" + myExchange + ": Jev chose " + lastJevCell + " (" + humanCell(pos.r, pos.c) + ")" + (lastConfidence != null ? " (confidence " + lastConfidence + ")" : "") + (warn ? " — " + warn : ""),
        reqText,
        "choice=" + String(choice) + (lastConfidence != null ? " confidence=" + lastConfidence : "") + "\n\n" + pretty(data)
      );
    }).catch(function (err) {
      if (myGameId !== gameId) return;
      waiting = false;
      var msg = err && err.message ? err.message : String(err);
      if (err instanceof TypeError) {
        msg += " (possible CORS/network block — see note at top of file; use a proxy you control for local testing)";
      }
      // Never logs the key: redact before console + DOM.
      if (typeof console !== "undefined" && console.error) console.error(redact(msg));
      renderStatus({ error: msg });
      renderTraffic("Move #" + myExchange + ": request failed.", reqText, "ERROR: " + redact(msg));
    });
  }

  function humanClick(r, c) {
    if (!gameLive || winner) return;
    if (waiting) return;                    // board disabled while Jev thinks
    if (!inBounds(r, c) || board[r][c]) return;
    var key = apiKeyEl.value;
    if (!key || !key.trim()) {              // refuse to play without a key
      renderStatus({ error: "Missing API key: paste your TypeSafe API key first. No request was sent." });
      return;
    }
    board[r][c] = "X";
    lastMove = { r: r, c: c, who: "X" };
    memHuman = "r" + r + "c" + c;
    var line = checkWin(board, r, c, "X");
    if (line) {
      winner = "X"; winningLine = line; gameLive = false;
      renderStatus({});
      return;
    }
    if (boardFull(board)) {
      winner = "Draw"; gameLive = false;
      renderStatus({});
      return;
    }
    requestJevMove(gameId);
  }

  // ---- p5 ----
  // Board geometry: left/top gutter holds the R1–R15 / C1–C15 legends.
  function boardMetrics() {
    var L = Math.max(30, Math.floor(window.width * 0.075));
    var pad = Math.max(8, Math.floor(L * 0.35));
    var cell = (window.width - L - pad) / SIZE; // cell size from canvas width
    return { L: L, pad: pad, cell: cell, bs: cell * SIZE };
  }

  function cellCenter(m, r, c) {
    return { x: m.L + c * m.cell + m.cell / 2, y: m.L + r * m.cell + m.cell / 2 };
  }

  function drawStoneX(cx, cy, cell, alpha) {
    var arm = cell * 0.30;
    var ctx = window.drawingContext;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.shadowColor = "rgba(30,27,75,0.45)";
    ctx.shadowBlur = cell * 0.12;
    ctx.shadowOffsetY = cell * 0.03;
    ctx.strokeStyle = "#4f46e5";
    ctx.lineWidth = cell * 0.13;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - arm, cy - arm); ctx.lineTo(cx + arm, cy + arm);
    ctx.moveTo(cx + arm, cy - arm); ctx.lineTo(cx - arm, cy + arm);
    ctx.stroke();
    ctx.restore();
  }

  function drawStoneO(cx, cy, cell, alpha) {
    var d = cell * 0.62;
    var ctx = window.drawingContext;
    window.noStroke();
    window.fill(220, 38, 38, Math.round(22 * (alpha == null ? 1 : alpha)));
    window.ellipse(cx, cy, d, d);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.shadowColor = "rgba(127,29,29,0.45)";
    ctx.shadowBlur = cell * 0.12;
    ctx.shadowOffsetY = cell * 0.03;
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = cell * 0.12;
    ctx.beginPath();
    ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  window.setup = function () {
    var w = Math.min(600, window.innerWidth - 32);
    w = Math.max(300, w);
    var cnv = window.createCanvas(w, w);
    cnv.parent("canvas-holder");
    window.textAlign(window.CENTER, window.CENTER);
    renderStatus({});
  };

  window.windowResized = function () {
    var w = Math.min(600, window.innerWidth - 32);
    w = Math.max(300, w);
    window.resizeCanvas(w, w);
  };

  window.draw = function () {
    var n = SIZE;
    var m = boardMetrics();
    var cell = m.cell, ox = m.L, oy = m.L, bs = m.bs;
    var ctx = window.drawingContext;

    // Canvas backdrop.
    var bg = ctx.createLinearGradient(0, 0, 0, window.height);
    bg.addColorStop(0, "#f8fafc");
    bg.addColorStop(1, "#e2e8f0");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, window.width, window.height);

    // Wooden board with soft shadow.
    ctx.save();
    ctx.shadowColor = "rgba(15,23,42,0.30)";
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 5;
    var wood = ctx.createLinearGradient(ox, oy, ox + bs, oy + bs);
    wood.addColorStop(0, "#f3cd8d");
    wood.addColorStop(0.55, "#e9b96f");
    wood.addColorStop(1, "#d9a056");
    ctx.fillStyle = wood;
    ctx.fillRect(ox, oy, bs, bs);
    ctx.restore();

    // Subtle alternating wash for readability.
    window.noStroke();
    for (var wr = 0; wr < n; wr++) {
      for (var wc = 0; wc < n; wc++) {
        if ((wr + wc) % 2) continue;
        window.fill(255, 255, 255, 26);
        window.rect(ox + wc * cell, oy + wr * cell, cell, cell);
      }
    }

    // R1–R15 / C1–C15 legends (1-based display; API keys stay r0–r14/c0–c14).
    var winSet = {};
    for (var wi = 0; wi < winningLine.length; wi++) winSet[winningLine[wi].r + ":" + winningLine[wi].c] = true;
    window.noStroke();
    window.fill(71, 85, 105);
    window.textStyle(window.BOLD);
    window.textSize(Math.max(9, cell * 0.30));
    for (var lr = 0; lr < n; lr++) {
      window.text("R" + (lr + 1), ox / 2, oy + lr * cell + cell / 2 + 1);
    }
    for (var lc = 0; lc < n; lc++) {
      window.text("C" + (lc + 1), ox + lc * cell + cell / 2, oy / 2);
    }
    window.textStyle(window.NORMAL);

    // Last-move wash + winning-five pulse (under the grid).
    var pulse = 0.5 + 0.5 * Math.sin(window.frameCount * 0.08);
    window.noStroke();
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var bx = ox + c * cell, by = oy + r * cell;
        if (winSet[r + ":" + c]) {
          window.fill(34, 197, 94, Math.round(110 + 90 * pulse));
          window.rect(bx, by, cell, cell);
        } else if (lastMove && lastMove.r === r && lastMove.c === c) {
          window.fill(250, 204, 21, 120);
          window.rect(bx, by, cell, cell);
        }
      }
    }

    // Grid lines + star points.
    window.stroke(122, 72, 18, 160);
    window.strokeWeight(1);
    for (var g = 0; g <= n; g++) {
      window.line(ox + g * cell, oy, ox + g * cell, oy + bs);
      window.line(ox, oy + g * cell, ox + bs, oy + g * cell);
    }
    // Board frame.
    window.noFill();
    window.stroke(107, 63, 14);
    window.strokeWeight(3);
    window.rect(ox, oy, bs, bs);

    // Hover preview: ghost X on the empty hovered square.
    var hov = null;
    try {
      var cv = document.querySelector("#canvas-holder canvas");
      if (cv && cv.matches(":hover") && gameLive && !winner && !waiting) {
        var hc = Math.floor((window.mouseX - ox) / cell);
        var hr = Math.floor((window.mouseY - oy) / cell);
        if (inBounds(hr, hc) && !board[hr][hc]) hov = { r: hr, c: hc };
      }
    } catch (e) { hov = null; }
    if (hov) {
      window.noStroke();
      window.fill(79, 70, 229, 22);
      window.rect(ox + hov.c * cell, oy + hov.r * cell, cell, cell);
    }

    // Stones.
    for (var sr2 = 0; sr2 < n; sr2++) {
      for (var sc2 = 0; sc2 < n; sc2++) {
        var v = board[sr2][sc2];
        if (!v) continue;
        var ctr = cellCenter(m, sr2, sc2);
        if (v === "X") drawStoneX(ctr.x, ctr.y, cell);
        else drawStoneO(ctr.x, ctr.y, cell);
      }
    }
    if (hov) {
      var hctr = cellCenter(m, hov.r, hov.c);
      drawStoneX(hctr.x, hctr.y, cell, 0.35);
    }

    // Winning strike-through (last move keeps its yellow cell tint above).
    if (winningLine.length) {
      var a = cellCenter(m, winningLine[0].r, winningLine[0].c);
      var z = cellCenter(m, winningLine[winningLine.length - 1].r, winningLine[winningLine.length - 1].c);
      ctx.save();
      ctx.shadowColor = "rgba(22,101,52,0.8)";
      ctx.shadowBlur = 10;
      ctx.strokeStyle = "rgba(21,128,61," + (0.65 + 0.3 * pulse).toFixed(3) + ")";
      ctx.lineWidth = Math.max(3, cell * 0.14);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(z.x, z.y);
      ctx.stroke();
      ctx.restore();
    }

    // Dim overlay while waiting (board disabled).
    if (waiting) {
      window.noStroke();
      window.fill(255, 255, 255, 70);
      window.rect(ox, oy, bs, bs);
    }
  };

  function canvasCell() {
    var m = boardMetrics();
    return {
      c: Math.floor((window.mouseX - m.L) / m.cell),
      r: Math.floor((window.mouseY - m.L) / m.cell)
    };
  }

  window.mousePressed = function () {
    // Only handle clicks inside the canvas.
    if (window.mouseX < 0 || window.mouseY < 0 || window.mouseX >= window.width || window.mouseY >= window.height) return;
    var pos = canvasCell();
    if (!inBounds(pos.r, pos.c)) return;
    humanClick(pos.r, pos.c);
    return false; // prevent default scrolling on touch
  };

  // Touch support (p5 forwards touch to mouse by default, but be explicit).
  window.touchStarted = function () {
    if (window.mouseX < 0 || window.mouseY < 0 || window.mouseX >= window.width || window.mouseY >= window.height) return;
    var pos2 = canvasCell();
    if (!inBounds(pos2.r, pos2.c)) return;
    humanClick(pos2.r, pos2.c);
    return false;
  };
})();
</script>
</body>
</html>
